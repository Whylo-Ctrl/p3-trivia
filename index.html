<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P3 Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Bungee&display=swap" rel="stylesheet">
<style>
/* Layout: game-show stage. Question board on the left, the spot map + play-by-play on the right, contestant podiums along the bottom. One deliberate dark look. */
:root{
  --stage:#0b0d2b; --stage-2:#1a1f5c; --panel:#141a4d; --panel-2:#1d2466; --line:#2b3383;
  --tile:#2230a0; --tile-hi:#3243c6; --tile-used:#0e1240;
  --ink:#f3f1ff; --ink-dim:#a7acda; --ink-faint:#6a71aa;
  --gold:#ffc843; --on-gold:#2a1d00;
  --money:#26b862; --money-deep:#13703a; --money-shadow:#0b4524;
  --attack:#f0453f; --wheel:#e6e9f5; --points:#dcae30; --china:#35a884;
  --good:#3ddc84; --bad:#ff5d62;
  --coin-hi:#ffe28f; --coin-mid:#e2aa22; --coin-lo:#9c6c08;
  --silver-hi:#ffffff; --silver-mid:#c9cfe0; --silver-lo:#7d859f;
  --w1:#3243c6; --w2:#dcae30; --w3:#1f9d55; --w4:#e33a35; --w5:#7247f5; --w6:#1c93cf; --w-china:#0d3a2e;
  --b1:#8e1723; --b2:#c42a33; --b3:#4b0f1a; --b4:#d9482c; --b-slice:#160408;
  --shade:rgba(3,4,20,.55); --scrim:rgba(4,5,22,.82);
  --f-display:'Bungee','Arial Black',system-ui,sans-serif;
  --f-num:'Anton',Impact,'Arial Narrow',sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background-color:var(--stage);background-image:radial-gradient(1100px 520px at 72% -8%,var(--stage-2),transparent 70%),radial-gradient(800px 500px at -10% 110%,var(--panel-2),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:1760px;margin:0 auto;padding-inline:clamp(16px,2.4vw,36px);padding-block:16px 28px;display:grid;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-p3{font-family:var(--f-display);font-size:21px;background:var(--gold);color:var(--on-gold);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 var(--coin-lo)}
.brand-text{display:grid;gap:4px;min-width:0}
.logo-word{font-family:var(--f-display);font-size:clamp(22px,2.6vw,34px);line-height:1}
.board-title{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.btn{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--ink-faint);background:var(--panel-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover:not(:disabled){background:var(--coin-hi);border-color:var(--coin-hi)}
.fj-title{font-family:var(--f-display);font-size:clamp(34px,6vw,70px);color:var(--gold);text-align:center;margin:0;line-height:1;text-shadow:0 5px 0 var(--shade)}
.fj-cat{text-align:center;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(16px,2vw,22px);margin:0}
.finalists{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.finalist{background:var(--shade);border-radius:16px;padding:16px;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;min-width:0}
.fname{font-family:var(--f-display);font-size:20px;overflow-wrap:anywhere}
.fscore{font-family:var(--f-num);font-size:36px;line-height:1}
.fscore.neg{color:var(--bad)}
.fw-row{display:flex;gap:8px;width:100%}
.fw-row .input{flex:1}
.ferr{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}
.clock{height:12px;border-radius:999px;background:var(--shade);overflow:hidden}
.clock i{display:block;height:100%;width:100%;background:var(--gold)}
.av.lg{--sz:76px;font-size:28px}
.av.xl{--sz:124px;font-size:44px;border-width:5px;box-shadow:0 0 0 6px var(--gold)}
.fj-win{font-family:var(--f-display);font-size:clamp(46px,8vw,96px);color:var(--gold);text-align:center;margin:0;line-height:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.winners{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.finalist.champ{background:transparent}
.champ .fscore{font-size:54px;color:var(--gold)}
.standings{list-style:none;margin:0 auto;padding:0;display:grid;gap:6px;width:min(440px,100%);counter-reset:r}
.standings li{display:flex;align-items:center;gap:10px;background:var(--shade);border-radius:10px;padding:6px 12px;counter-increment:r}
.standings li::before{content:counter(r);font-family:var(--f-num);font-size:20px;width:22px;color:var(--ink-dim)}
.standings .st-name{flex:1;font-weight:800;min-width:0;overflow-wrap:anywhere}
.standings b{font-family:var(--f-num);font-size:22px;font-weight:400}
.standings b.neg{color:var(--bad)}
#editbar{display:grid;gap:12px}
.matchbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:17px}
.mside{display:flex;align-items:center;gap:8px}
.mscore{font-family:var(--f-num);font-size:44px;line-height:1;color:var(--gold);font-weight:400}
.turn-who{display:grid;justify-items:center;gap:6px}
.clock-num{font-family:var(--f-num);font-size:clamp(44px,6vw,68px);line-height:1;text-align:center;margin:0}
.sheet.timeup .clock-num{color:var(--bad);animation:shake .6s}
.sheet.timeup .clock i{background:var(--bad)}
.tally{font-family:var(--f-num);font-size:clamp(90px,15vw,170px);line-height:1;text-align:center;color:var(--gold);margin:0}
.tally.bump{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.tally-btn{font-family:var(--f-display);font-size:clamp(26px,3.6vw,42px);padding:16px 44px;border-radius:20px;background:var(--good);color:var(--stage);border:0;cursor:pointer;box-shadow:0 8px 0 var(--money-shadow);transition:transform .05s}
.tally-btn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--money-shadow)}
.pool-btn.on{border-color:var(--gold);color:var(--gold)}
.btn.live-btn{border-color:var(--good);color:var(--good)}
.btn.live-btn .dot{background:var(--good)}
.flag.buzz{background:var(--good);color:var(--stage)}
.judge{position:relative}
.judge .bz-mark{position:absolute;top:-9px;left:-6px;background:var(--gold);color:var(--on-gold);font-family:var(--f-num);font-size:15px;line-height:1;padding:3px 7px;border-radius:999px;box-shadow:0 2px 6px var(--shade)}
.judge .bz-mark:empty{display:none}
.judge.first{box-shadow:inset 0 0 0 3px var(--gold)}
.buzz-panel{display:grid;gap:10px;background:var(--shade);border-radius:12px;padding:12px 14px}
.bz-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.bz-note{margin:0;color:var(--ink-dim);font-size:14.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bz-live{display:inline-flex;align-items:center;gap:8px;color:var(--good);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.bz-live .dot{background:var(--good);animation:pulse 1.1s ease-in-out infinite}
.buzz-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:bz}
.buzz-list li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:var(--panel);counter-increment:bz}
.buzz-list li::before{content:'#' counter(bz);font-family:var(--f-num);font-size:20px;color:var(--ink-dim);width:30px}
.buzz-list li b{flex:1;font-weight:800}
.buzz-list li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-weight:700}
.buzz-list li.first{background:var(--gold);color:var(--on-gold)}
.buzz-list li.first::before,.buzz-list li.first span:last-child{color:var(--on-gold)}
.howto{margin:0;padding-left:22px;display:grid;gap:8px;max-width:62ch}
.dev-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dev-list li{display:flex;align-items:center;gap:10px}
#buzzer{min-height:100vh;min-height:100dvh}
.bz{display:grid;grid-template-rows:auto auto 1fr auto;gap:16px;padding-inline:16px;padding-block:16px 28px;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh}
.bz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bz-conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.bz-conn .dot{background:var(--ink-faint)}
.bz-conn.on{color:var(--good)}
.bz-conn.on .dot{background:var(--good)}
.bz-me{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:10px 12px;font-family:var(--f-display);font-size:18px;min-width:0}
.bz-me .bz-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz-me b{font-family:var(--f-num);font-weight:400;font-size:24px}
.bz-me b.neg,.bz-scores b.neg{color:var(--bad)}
.bz-main{display:grid;justify-items:center;align-content:center;gap:18px;min-width:0}
.bz-q{margin:0;text-align:center;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-size:15px;overflow-wrap:anywhere}
.bz-q b{display:block;font-family:var(--f-num);font-weight:400;font-size:46px;letter-spacing:.02em;color:var(--gold)}
.bz-btn{width:min(74vw,46vh,340px);aspect-ratio:1;border-radius:50%;border:0;font-family:var(--f-display);font-size:clamp(34px,11vw,64px);color:var(--ink);background:radial-gradient(circle at 40% 35%,var(--attack),var(--b1));box-shadow:0 14px 0 var(--b3),0 0 0 8px var(--gold);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .06s,box-shadow .06s}
.bz-btn.live{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 14px 0 var(--b3),0 0 0 16px var(--gold)}}
.bz-btn.live:active{transform:translateY(10px);box-shadow:0 4px 0 var(--b3),0 0 0 8px var(--gold)}
.bz-btn.idle{background:var(--panel-2);box-shadow:0 14px 0 var(--tile-used),0 0 0 8px var(--line);color:var(--ink-faint);cursor:default}
.bz-btn.out{background:var(--tile-used);box-shadow:0 14px 0 var(--b-slice),0 0 0 8px var(--b3);color:var(--bad);cursor:default}
.bz-btn.done{background:radial-gradient(circle at 40% 35%,var(--good),var(--money-deep));box-shadow:0 6px 0 var(--money-shadow),0 0 0 8px var(--gold);color:var(--stage);cursor:default;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bz-sub{margin:0;text-align:center;font-size:18px;font-weight:700;color:var(--ink-dim);text-wrap:balance}
.bz-msg{text-align:center;display:grid;gap:8px;max-width:40ch}
.bz-msg h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,6vw,30px);margin:0}
.bz-msg p{margin:0;color:var(--ink-dim)}
.bz-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.bz-pick .btn{text-transform:none;letter-spacing:0;font-size:18px;padding:12px;justify-content:flex-start}
.bz-scores{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.bz-scores li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel)}
.bz-scores li.me{box-shadow:inset 0 0 0 2px var(--gold)}
.bz-scores span{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz-scores b{font-family:var(--f-num);font-weight:400;font-size:18px}
.btn.final-btn{border-color:var(--gold);color:var(--gold)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--stage)}
.btn.danger:hover:not(:disabled){background:var(--b2);border-color:var(--b2);color:var(--ink)}
.btn.big{font-size:18px;padding:14px 28px;border-radius:14px}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn[data-armed="1"],.mini[data-armed="1"],.cat-del[data-armed="1"]{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.mini{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink-faint);border-radius:6px;font-weight:700;font-size:12px;padding:3px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.mini:hover{color:var(--ink);border-color:var(--ink-faint)}

/* edit bar */
.editbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;background:var(--panel);border:2px dashed var(--gold);border-radius:14px;padding:12px 14px}
.editbar .hint{flex:1 1 220px;font-size:14px;color:var(--ink-dim);align-self:center}
.field{display:grid;gap:5px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);min-width:0}
.input{background:var(--stage);border:2px solid var(--line);border-radius:8px;color:var(--ink);font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;padding:8px 10px;min-width:0;width:100%}
.input:focus{border-color:var(--gold);outline:none}
textarea.input{resize:vertical;min-height:96px;line-height:1.4}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px;align-items:start}
@media (max-width:1020px){.stage{grid-template-columns:minmax(0,1fr)}}
.board-wrap{background:var(--tile-used);border-radius:16px;padding:6px;overflow-x:auto;box-shadow:0 18px 40px var(--shade);min-width:0}
.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(108px,1fr));gap:6px}
.cat{min-height:clamp(58px,8.4vh,88px);display:grid;place-items:center;text-align:center;padding:8px;background:var(--tile);border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:clamp(13px,1.15vw,18px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.cat.untitled{color:var(--ink-faint)}
.cat-edit{position:relative;padding:6px}
.cat-input{text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding-right:26px}
.cat-del{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.tile{appearance:none;border:0;border-radius:8px;height:clamp(62px,10.2vh,112px);background:linear-gradient(180deg,var(--tile-hi),var(--tile));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px;transition:transform .12s,filter .12s;position:relative;color:var(--ink);min-width:0}
.tile .tv{font-family:var(--f-num);font-size:clamp(26px,3vw,48px);line-height:1;color:var(--gold);text-shadow:0 3px 0 var(--shade);letter-spacing:.02em}
.tile:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
.tile:disabled{cursor:not-allowed;filter:saturate(.55) brightness(.75)}
.tile.used{background:var(--tile-used);cursor:default}
.tile.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.tile.empty .tv{color:var(--ink-faint);text-shadow:none}
.tile .tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.tile-edit{font-size:12.5px;line-height:1.25;text-align:center}
.tile-edit .prev{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-edit .tv{font-size:22px}
.tile-edit.was-used::after{content:'played';position:absolute;top:3px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tile-edit.no-answer::before{content:'no answer';position:absolute;bottom:3px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bad)}

/* side */
.side{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border-radius:16px;padding:14px;box-shadow:0 18px 40px var(--shade);min-width:0}
.panel-h{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.03em;color:var(--ink-dim);margin:0 0 10px}
.callout{display:grid;gap:10px;background:var(--panel-2);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.callout p{margin:0}
.callout.go{border:2px solid var(--gold)}
.callout b{font-weight:800}
.move-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.move-btn{border-color:var(--sc)}
.move-btn .dot{background:var(--sc)}
.map{position:relative;width:100%;aspect-ratio:600/440}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arrow{fill:none;stroke:var(--ink-faint);stroke-width:3;stroke-linecap:round}
.arrow.hi{stroke:var(--gold);stroke-width:4;stroke-dasharray:10 8;animation:march .8s linear infinite}
@keyframes march{to{stroke-dashoffset:-18}}
.ah-fill{fill:var(--ink-faint)}
.ah-hi-fill{fill:var(--gold)}
.spot .ring{fill:var(--stage);stroke-width:7;transition:fill .2s}
.spot .glow{fill:none;stroke:none}
.spot-money .ring{stroke:var(--money)}
.spot-attack .ring{stroke:var(--attack)}
.spot-wheel .ring{stroke:var(--wheel)}
.spot-points .ring{stroke:var(--points)}
.spot-china .ring{stroke:var(--china)}
.spot.target{cursor:pointer}
.spot.target .ring{fill:var(--panel-2)}
.spot.target:hover .ring,.spot.target:focus .ring{fill:var(--tile)}
.spot.target .glow{stroke:var(--gold);stroke-width:4;animation:pulse 1.1s ease-in-out infinite}
.spot:focus{outline:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.sl{font-family:var(--f-display);fill:var(--ink);font-size:19px;text-anchor:middle;dominant-baseline:central}
.sl.money{font-size:30px;fill:var(--money)}
.ss{font-family:var(--f-body);font-weight:800;font-size:10px;letter-spacing:.16em;fill:var(--ink-dim);text-anchor:middle;dominant-baseline:central}
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--pc);background:var(--pc);box-shadow:0 4px 10px var(--shade);overflow:hidden;transition:left .8s cubic-bezier(.45,1.45,.5,1),top .8s cubic-bezier(.45,1.45,.5,1);display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(10px,1.1vw,16px);color:var(--ink)}
.token img{width:100%;height:100%;object-fit:cover;display:block}
.token.active{box-shadow:0 0 0 3px var(--gold),0 4px 10px var(--shade);animation:bob 1s ease-in-out infinite;z-index:2}
@keyframes bob{50%{transform:translate(-50%,-64%)}}
.log{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;color:var(--ink-dim);max-height:232px;overflow:auto}
.log li{display:flex;gap:9px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.log li:first-child{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--pc,var(--ink-faint))}

/* podiums */
.podiums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.podium{position:relative;background:linear-gradient(180deg,var(--panel-2),var(--panel));border-radius:16px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"av name" "av spot" "score score" "cash cash" "adj adj";gap:3px 12px;align-items:center;box-shadow:0 14px 30px var(--shade)}
.podium.control{box-shadow:inset 0 0 0 3px var(--gold),0 14px 30px var(--shade)}
.podium .av{grid-area:av}
.pod-name{grid-area:name;font-family:var(--f-display);font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:64px}
.pod-spot{grid-area:spot;font-size:13.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.pod-score{grid-area:score;font-family:var(--f-num);font-size:clamp(34px,3.2vw,50px);line-height:1;text-align:center;background:var(--stage);border-radius:10px;padding:9px 10px 7px;margin-top:8px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.pod-score.neg{color:var(--bad)}
.pod-score.up{animation:up .9s}
.pod-score.down{animation:down .9s}
@keyframes up{0%{color:var(--good);transform:scale(1.08)}}
@keyframes down{0%{color:var(--bad);transform:scale(.94)}}
.pod-cash{grid-area:cash;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px}
.pod-cash b{color:var(--good);font-family:var(--f-num);font-size:19px;font-weight:400;letter-spacing:.03em;margin-left:4px}
.mini:disabled{opacity:.35;cursor:default}
.pod-adj{grid-area:adj;display:flex;gap:6px;justify-content:center;margin-top:6px}
.chip{position:absolute;top:12px;right:12px;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.av{--sz:54px;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;border:3px solid var(--pc);background:var(--pc);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none;color:var(--ink)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{--sz:32px;border-width:2px;font-size:13px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet{width:min(940px,100%);border-radius:22px;padding:clamp(18px,3vw,36px);display:grid;gap:clamp(14px,2vw,22px);background:var(--panel);box-shadow:0 30px 80px var(--shade);animation:pop .28s cubic-bezier(.3,1.4,.5,1);min-width:0}
@keyframes pop{from{transform:scale(.94);opacity:.5}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.1}
.sheet h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.sec-label{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0}
.muted{color:var(--ink-dim);font-weight:500}

.sheet.clue{background:linear-gradient(180deg,var(--tile-hi),var(--tile) 60%,var(--tile-used))}
.clue-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.clue-cat{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:var(--ink-dim);overflow-wrap:anywhere;min-width:0}
.clue-val{font-family:var(--f-num);font-size:36px;line-height:1;color:var(--gold)}
.clue-text{margin:0;font-weight:700;text-transform:uppercase;font-size:clamp(22px,3.3vw,46px);line-height:1.18;text-align:center;text-wrap:balance;text-shadow:0 3px 0 var(--shade);padding-block:clamp(6px,3vh,34px);overflow-wrap:anywhere}
.answer-box{display:grid;gap:6px;justify-items:center;text-align:center}
.answer{margin:0;font-size:clamp(20px,2.4vw,32px);font-weight:800;color:var(--gold);overflow-wrap:anywhere}
.judges{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.judge{display:flex;align-items:center;gap:10px;background:var(--shade);border-radius:12px;padding:8px 10px;min-width:0}
.jname{flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jbtn{appearance:none;width:42px;height:42px;border-radius:10px;border:0;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .1s}
.jbtn:hover{transform:scale(1.07)}
.jbtn.ok{background:var(--good);color:var(--stage)}
.jbtn.no{background:var(--bad);color:var(--stage)}
.jbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.judge.is-wrong{opacity:.65}
.jwrong{font-family:var(--f-num);color:var(--bad);font-size:22px}

.sheet.action{border:3px solid var(--sc);background:radial-gradient(640px 280px at 50% 0%,color-mix(in srgb,var(--sc) 22%,transparent),transparent 72%),var(--panel)}
.act-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.act-spot{font-family:var(--f-display);font-size:clamp(24px,3vw,38px);line-height:1;color:var(--sc)}
.act-who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:0}
.act-why{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.lead{margin:0;text-align:center;font-size:clamp(18px,2vw,24px);font-weight:600;text-wrap:balance}
.big-result{font-family:var(--f-num);font-size:clamp(60px,9vw,112px);line-height:1;text-align:center;color:var(--gold);margin:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.big-result.neg{color:var(--bad)}
.big-result.zero{color:var(--ink)}
.choose{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choose .btn{text-transform:none;letter-spacing:0;font-size:16px;padding:8px 14px 8px 8px}

.picks{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap;perspective:900px}
.pick{appearance:none;border:0;background:none;padding:0;width:clamp(92px,20vw,160px);aspect-ratio:3/4;cursor:pointer}
.pick:disabled{cursor:default}
.pick-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .25s}
.pick:hover:not(:disabled) .pick-in{transform:translateY(-8px)}
.pick-front,.pick-back{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pick-front{background:linear-gradient(160deg,var(--money),var(--money-deep));font-family:var(--f-display);font-size:clamp(44px,7vw,72px);color:var(--ink);box-shadow:0 10px 0 var(--money-shadow)}
.pick-back{transform:rotateY(180deg);background:var(--stage);border:3px solid var(--money);font-family:var(--f-num);font-size:clamp(28px,4.4vw,48px);color:var(--good)}
.pick.open .pick-in{animation:flip .6s cubic-bezier(.4,1.4,.5,1) both}
.pick.open:not(.chosen) .pick-in{animation-delay:.6s}
.pick.open:not(.chosen){opacity:.6}
.pick.chosen .pick-back{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 40px color-mix(in srgb,var(--gold) 45%,transparent)}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}

.coin-stage{display:grid;place-items:center;height:230px;perspective:800px}
.coin-lift{display:grid;place-items:center}
.coin-stage.tossing .coin-lift{animation:toss var(--dur,2.2s) cubic-bezier(.3,.7,.4,1)}
@keyframes toss{0%{transform:translateY(0)}45%{transform:translateY(-80px) scale(1.1)}100%{transform:translateY(0)}}
.coin{width:160px;height:160px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--f-display);font-size:22px}
.face.heads{background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--coin-mid) 55%,var(--coin-lo));color:var(--on-gold);box-shadow:inset 0 0 0 9px color-mix(in srgb,var(--coin-lo) 60%,transparent)}
.face.tails{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,var(--silver-hi),var(--silver-mid) 55%,var(--silver-lo));color:var(--stage);box-shadow:inset 0 0 0 9px color-mix(in srgb,var(--silver-lo) 60%,transparent)}

.flag{display:inline-block;margin-left:6px;font-family:var(--f-body);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:999px;vertical-align:middle}
.flag.shield{background:var(--good);color:var(--stage)}
.flag.curse{background:var(--bad);color:var(--stage)}
.flag.life{background:var(--gold);color:var(--on-gold)}
.flag.frozen{background:var(--w6);color:var(--stage)}
.flag.link{background:var(--w5);color:var(--ink)}
.pick.mbox .pick-front{background:linear-gradient(160deg,var(--china),var(--w-china));box-shadow:0 10px 0 var(--b-slice);display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;gap:0}
.pick.mbox .pick-front small{font-size:.42em;color:var(--gold);line-height:1}
.pick.mbox .pick-back{border-color:var(--china);color:var(--ink);font-family:var(--f-display);font-size:clamp(13px,1.8vw,19px);line-height:1.15;padding:10px;text-align:center}
.pick.mbox.chosen .pick-back{border-color:var(--gold);color:var(--gold)}
.wheel-box{position:relative;width:min(450px,80vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 24px var(--shade))}
.pointer{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:36px solid var(--gold);filter:drop-shadow(0 3px 0 var(--coin-lo));z-index:2}
.pointer.bad{border-top-color:var(--bad);filter:drop-shadow(0 3px 0 var(--b3))}
.sheet.bad-sheet{background:radial-gradient(640px 300px at 50% 0%,color-mix(in srgb,var(--bad) 28%,transparent),transparent 72%),var(--b-slice)}
.wl{font-family:var(--f-display)}

.odds{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.odds span{padding:5px 12px;border-radius:999px;border:2px solid}
.odds-lose{color:var(--bad);border-color:var(--bad)}
.odds-win{color:var(--good);border-color:var(--good)}
.wagers{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wagers .btn{font-family:var(--f-num);font-size:26px;letter-spacing:.03em;padding:10px 24px;font-weight:400}
.die-stage{display:grid;place-items:center;height:190px}
.die{width:124px;height:124px;border-radius:24px;background:linear-gradient(145deg,var(--silver-hi),var(--silver-mid));box-shadow:inset 0 -7px 0 var(--silver-lo),0 14px 30px var(--shade);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px}
.pip{width:22px;height:22px;border-radius:50%;background:var(--stage);place-self:center;visibility:hidden}
.pip.on{visibility:visible}
.die.rolling{animation:tumble .4s linear infinite}
.die.win{box-shadow:inset 0 -7px 0 var(--silver-lo),0 0 0 6px var(--good),0 0 44px color-mix(in srgb,var(--good) 50%,transparent)}
.die.lose{box-shadow:inset 0 -7px 0 var(--silver-lo),0 0 0 6px var(--bad),0 0 44px color-mix(in srgb,var(--bad) 45%,transparent)}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-18px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-12px)}100%{transform:rotate(360deg) translateY(0)}}
.chyna{font-family:var(--f-display);font-size:clamp(46px,9vw,108px);text-align:center;margin:0;color:var(--china);line-height:1;animation:shake .7s;text-shadow:0 5px 0 var(--shade)}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-14px) rotate(-3deg)}30%{transform:translateX(12px) rotate(3deg)}45%{transform:translateX(-9px) rotate(-2deg)}60%{transform:translateX(7px) rotate(1deg)}75%{transform:translateX(-3px)}}

.players-list{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow .input{flex:1 1 160px;width:auto}
.av-up{cursor:pointer;position:relative;display:inline-grid}
.av-up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.av-up::after{content:'photo';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--stage);color:var(--ink-dim);border-radius:4px;padding:0 4px}
input[type=color]{width:46px;height:40px;padding:2px;border:2px solid var(--line);border-radius:8px;background:var(--stage);cursor:pointer}
.help{font-size:13.5px;color:var(--ink-dim);margin:2px 0 0;letter-spacing:0;text-transform:none;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.status{font-size:14px;color:var(--good);min-height:1.4em;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--gold)}

.rules{display:grid;gap:18px}
.rules ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.rules li b{font-weight:800}
.rules .spots{list-style:none;padding:0}
.rules .spots li{display:flex;gap:10px;align-items:baseline}
.rules .spots .dot{width:12px;height:12px;transform:translateY(1px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-width:520px){.pod-name{padding-right:0}.chip{position:static;grid-column:1/-1;justify-self:start;margin-top:4px}}
</style>
</head>

<div class="app">

  </main>
  <section class="podiums" id="podiums" aria-label="Scores"></section>
</div>

function normBoard(b) {

  const values = (Array.isArray(b.values) ? b.values : [100, 200, 300, 400, 500]).map(Number).filter(n => !isNaN(n));
  const out = { title: String(b.title || 'P3 Trivia'), values: values.length ? values : [100, 200, 300, 400, 500], categories: [] };
  b.categories.forEach(c => {
    const clues = (Array.isArray(c.clues) ? c.clues : []).map(x => {
      const q = String(x.q || ''), a = String(x.a || '');
      return { id: String(x.id || uid()), q, a: a.trim() ? a : (KNOWN_ANSWERS[q.trim()] || a), starter: !!x.starter };
    });
    while (clues.length < out.values.length) clues.push(clue());
    out.categories.push({ id: String(c.id || uid()), name: String(c.name || ''), clues });
  });
  if (!out.categories.length) out.categories.push({ id: uid(), name: '', clues: out.values.map(() => clue()) });
  const f = b.final && typeof b.final === 'object' ? b.final : defaultFinal();
  out.final = { cat: String(f.cat || ''), q: String(f.q || ''), a: String(f.a || '') };
  out.seeded = Array.isArray(b.seeded) ? b.seeded.map(String) : [];

    if (out.seeded.includes(mv.id)) return;
    const c = out.categories[mv.ci], a = c && c.clues[mv.from], z = c && c.clues[mv.to];
    if (a && z && a.q.trim() === mv.q && !z.q.trim()) { z.q = a.q; z.a = a.a; z.starter = false; a.q = ''; a.a = ''; }
    out.seeded.push(mv.id);
  });
  SEEDS.forEach(sd => {
    if (out.seeded.includes(sd.id)) return;
    const c = out.categories[sd.ci];
    if (sd.name) { if (c && !c.name.trim()) c.name = sd.name; }
    else { const k = c && c.clues[sd.ri]; if (k && (!k.q.trim() || k.starter)) { k.q = sd.q; k.a = sd.a; k.starter = false; } }

  });

}

/* ---------- game rules ---------- */
function parseSlice(str, onBad) {
  const t = String(str).trim();
  let m;
  if (/^ch[iy]+n+a+!*$/i.test(t)) return { type: 'china', label: 'CHYYYNA' };
  if (!onBad && /^bad\s*wheel$/i.test(t)) return { type: 'bad', label: 'BAD WHEEL' };
  if (!onBad && /^(double|x2|2x)$/i.test(t)) return { type: 'double', label: 'DOUBLE' };
  if (!onBad && (m = t.match(/^steal\s*(\d+)$/i))) return { type: 'steal', n: +m[1], label: 'STEAL ' + m[1] };
  if ((m = t.match(/^give\s*(\d+)$/i))) return { type: 'give', n: +m[1], label: 'GIVE ' + m[1] };
  if (/^(half|lose half)$/i.test(t)) return { type: 'half', label: 'LOSE HALF' };
  if (/^nothing$/i.test(t)) return { type: 'nothing', label: 'NOTHING' };
  if (/^(extra\s*life|\+?1\s*life)$/i.test(t)) return { type: 'life', label: 'EXTRA LIFE' };
  if (/^good\s*wheel$/i.test(t)) return { type: 'good', label: 'GOOD WHEEL' };
  if (/^(pick\s*a\s*player|link|ride\s*along)$/i.test(t)) return { type: 'link', label: 'PICK A PLAYER' };
  if (/^(frozen|freeze)$/i.test(t)) return { type: 'freeze', label: 'FROZEN' };
  if (/^meet\s*trump$/i.test(t)) return { type: 'tax', pct: 5, label: 'MEET TRUMP' };
  if ((m = t.match(/^tax\s*(\d+)\s*%?$/i))) return { type: 'tax', pct: +m[1], label: 'TAX ' + m[1] + '%' };
  if (/^swap\s*(w\/|with)?\s*(the\s*)?last(\s*place)?$/i.test(t)) return { type: 'swaplast', label: 'SWAP W/ LAST' };
  if (/^swap(\s*scores?)?$/i.test(t)) return { type: 'swap', label: 'SWAP SCORES' };
  if (/^free\s*move$/i.test(t)) return { type: 'free', label: 'FREE MOVE' };
  if (/^shield$/i.test(t)) return { type: 'shield', label: 'SHIELD' };
  if (/^curse[d]?$/i.test(t)) return { type: 'curse', label: 'CURSE' };
  if (/^(extra\s*spin|spin\s*again)$/i.test(t)) return { type: 'again', label: 'SPIN AGAIN' };
  if (/^back\s*to\s*(\$\$\$|start)$/i.test(t)) return { type: 'start', label: 'BACK TO $$$' };
  if ((m = t.match(/^(everyone(\s*else)?|all\s*others|others)\s*\+?\s*(\d+)$/i))) return { type: 'others', n: +m[3], label: 'OTHERS +' + m[3] };
  if ((m = t.match(/^([+\-−]?)\s*(\d+)$/))) {
    let n = (m[1] === '-' || m[1] === '−' ? -1 : 1) * (+m[2]);
    if (onBad) n = -Math.abs(n); // everything on the Bad Wheel costs points
    return { type: 'points', n, label: signed(n) };
  }
  return { type: 'custom', label: t.slice(0, 12).toUpperCase(), raw: t };
}
function wheelSlices(bad) {
  const src = bad ? S.settings.badWheel : S.settings.wheel;
  let l = (src || []).map(s => String(s).trim()).filter(Boolean).map(s => parseSlice(s, bad));
  if (l.length < 2) l = (bad ? DEFAULT_SETTINGS.badWheel : DEFAULT_SETTINGS.wheel).map(s => parseSlice(s, bad));
  return l;
}
function pickPrizes() {
  let l = S.settings.moneyPrizes.length ? S.settings.moneyPrizes : DEFAULT_SETTINGS.moneyPrizes;
  l = shuffle(l);
  const out = [];
  for (let i = 0; i < 3; i++) out.push(l[i % l.length]);
  return shuffle(out);
}
function moveOptions(p) { const o = (ARROWS[p.spot] || ['attack']).slice(); if (p.spot === 'china') o.push('stay'); return o; }

function enterSpot(p, spot) {
  const g = S.game;
  p.spot = spot;
  if (spot === 'money') { g.phase = 'money'; g.pending = { p: p.id, prizes: pickPrizes(), picked: null }; }
  else if (spot === 'attack') { g.phase = 'attack'; g.pending = { p: p.id, call: null, result: null, rot: 0 }; }
  else if (spot === 'wheel') { g.phase = 'wheel'; g.pending = { p: p.id, why: 'Landed on the Good Wheel', result: null, rot: 0 }; }
  else if (spot === 'points') { g.phase = 'points'; g.pending = { p: p.id, wager: null, allIn: false, roll: null }; }

// Any time a player would lose points: an extra life cancels the loss and is used up.
function lose(p, n) {
  if (!(n > 0)) return false;
  if (p.lives > 0) { p.lives--; log(p.name + '’s extra life blocks ' + signed(-n), p.id); return true; }
  p.score -= n;
  return false;
}
function applyChina(p, src) {
  const g = S.game, before = p.score;
  let kind;
  p.spot = 'china';
  if (src === 'bad') {
    if (before > 0) {
      kind = lose(p, before) ? 'blocked' : 'wipe';
      if (kind === 'wipe') log('CHYYYNA! ' + p.name + ' loses everything (' + fmt(before) + ' → 0)', p.id);
    } else { p.curse = true; kind = 'curse'; log('CHYYYNA! ' + p.name + ' is cursed: next wrong answer costs double', p.id); }
  } else {
    if (before < 0) { p.score = 0; kind = 'clean'; log('CHYYYNA! ' + p.name + ' gets a clean slate (' + fmt(before) + ' → 0)', p.id); }
    else { p.lives = (p.lives || 0) + 1; kind = 'life'; log('CHYYYNA! ' + p.name + ' gets an extra life', p.id); }
  }
  g.phase = 'china'; g.pending = { p: p.id, before, kind, src };
}
function drawMystery() {

  if (l.length < 3) l = DEFAULT_SETTINGS.mystery.slice();
  return shuffle(l).slice(0, 3);
}
function applySlice(p, s, pd, wname) {
  if (s.type === 'points') {
    if (s.n < 0) {
      if (lose(p, -s.n)) pd.outcome = p.name + '’s extra life blocks the ' + signed(s.n) + '.';
      else { pd.outcome = signed(s.n) + ' for ' + p.name; log(wname + ': ' + p.name + ' ' + signed(s.n), p.id); }
    } else { p.score += s.n; pd.outcome = signed(s.n) + ' for ' + p.name; log(wname + ': ' + p.name + ' ' + signed(s.n), p.id); }
  }
  else if (s.type === 'bad') { pd.toBad = true; log(p.name + ' got BAD WHEEL (' + wname + ')', p.id); }
  else if (s.type === 'good') { pd.toGood = true; log(p.name + ' got GOOD WHEEL (' + wname + ')', p.id); }
  else if (s.type === 'nothing') { pd.outcome = 'Nothing happens.'; log(wname + ': nothing for ' + p.name, p.id); }
  else if (s.type === 'link') {
    if (S.players.length < 2) pd.outcome = 'Nobody to pick.';
    else pd.link = true;
  } else if (s.type === 'freeze') { p.frozen = true; pd.outcome = p.name + ' is frozen and can\u2019t answer the next question.'; log(wname + ': ' + p.name + ' is frozen for 1 turn', p.id); }
  else if (s.type === 'tax') {
    const amt = p.score > 0 ? Math.round(p.score * s.pct / 100) : 0;
    if (!amt) { pd.outcome = (s.label === 'MEET TRUMP' ? 'Trump checks the books: ' : '') + p.name + ' has no points to tax.'; log(wname + ': nothing to tax for ' + p.name, p.id); }
    else if (lose(p, amt)) pd.outcome = p.name + '\u2019s extra life blocks the tax.';
    else { pd.outcome = (s.label === 'MEET TRUMP' ? p.name + ' meets Trump and gets taxed ' : p.name + ' gets taxed ') + s.pct + '%: ' + signed(-amt) + '.'; log(wname + ': ' + p.name + ' taxed ' + s.pct + '% (' + signed(-amt) + ')', p.id); }
  }
  else if (s.type === 'life') { p.lives = (p.lives || 0) + 1; pd.outcome = p.name + ' gets an extra life. It blocks the next time they would lose points.'; log(wname + ': ' + p.name + ' gets an extra life', p.id); }
  else if (s.type === 'swap') {
    if (S.players.length < 2) pd.outcome = 'Nobody to swap with.';
    else pd.swap = true;
  } else if (s.type === 'free') { pd.free = true; log(wname + ': ' + p.name + ' gets a free move', p.id); }
  else if (s.type === 'shield') { p.shield = true; pd.outcome = p.name + '’s next wrong answer costs nothing.'; log(wname + ': ' + p.name + ' gets a Shield', p.id); }
  else if (s.type === 'curse') { p.curse = true; pd.outcome = p.name + '’s next wrong answer costs double.'; log(wname + ': ' + p.name + ' is cursed', p.id); }
  else if (s.type === 'again') { pd.again = true; pd.outcome = p.name + ' spins again.'; log(wname + ': ' + p.name + ' spins again', p.id); }
  else if (s.type === 'start') { p.spot = 'money'; pd.outcome = p.name + '’s token goes back to $$$.'; log(wname + ': ' + p.name + ' sent back to $$$', p.id); }
  else if (s.type === 'others') {
    S.players.forEach(x => { if (x.id !== p.id) x.score += s.n; });
    pd.outcome = 'Everyone except ' + p.name + ' gets ' + signed(s.n) + '.';
    log(wname + ': everyone but ' + p.name + ' gets ' + signed(s.n), p.id);
  } else if (s.type === 'swaplast') {
    const others = S.players.filter(x => x.id !== p.id);

function finalPool() {
  const sorted = S.players.slice().sort((a, b) => b.score - a.score);

  const cut = sorted[1].score;
  const above = sorted.filter(p => p.score > cut).map(p => p.id);
  const tied = sorted.filter(p => p.score === cut).map(p => p.id);
  if (above.length + tied.length === 2) return { sure: above.concat(tied), pool: [] };
  return { sure: above, pool: tied };
}

A.cancelFinal = () => { stopClock(); act(finish); };
A.toWagers = () => {

A.lockWager = d => {

  if (!p || !i) return;
  const raw = String(i.value).trim(), n = parseInt(raw.replace(/[^\d]/g, ''), 10), max = maxWager(p);
  if (raw === '' || isNaN(n)) { if (e) e.textContent = 'Type a bet from 0 to ' + fmt(max) + '.'; return; }
  if (n > max) { if (e) e.textContent = 'Too high. The most ' + p.name + ' can bet is ' + fmt(max) + '.'; return; }
  act(() => { pd.wagers[p.id] = n; });
};
A.unlockWager = d => { const pd = S.game.pending; act(() => { delete pd.wagers[d.id]; }); };
A.newRound = () => {
  const pd = S.game.pending;

  act(() => { pd.step = 'spin'; pd.cur = { cat: null, rot: 0, slices: null, counts: {}, turn: 0, order: turnOrder(pd, pd.rounds.length) }; });
};
A.spinCat = () => {
  const pd = S.game.pending, cur = pd.cur;
  if (!cur || cur.cat) return;
  const sl = catsLeft(pd), n = sl.length, a = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const rot = 360 * 6 - idx * a + (Math.random() - 0.5) * a * 0.7;
  const dur = reduced ? 400 : 4600;
  busy = true;
  const w = document.querySelector('.wheel'), b = $('#spinBtn');
  if (b) b.disabled = true;
  if (w) { w.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.7,.1,1)'; w.getBoundingClientRect(); w.style.transform = 'rotate(' + rot + 'deg)'; }
  setTimeout(() => {
    busy = false;
    act(() => { cur.slices = sl; cur.cat = sl[idx]; cur.rot = rot; pd.used.push(cur.cat); log('Final round ' + (pd.rounds.length + 1) + ' category: ' + cur.cat); });
  }, dur + 120);
};
A.fjFlip = () => {
  const pd = S.game.pending, cur = pd && pd.cur;
  if (!cur || !cur.cat || cur.flip) return;
  const result = Math.random() < 0.5 ? 'H' : 'T', rot = 360 * 6 + (result === 'T' ? 180 : 0), dur = reduced ? 300 : 2300;
  busy = true;
  const stage = document.querySelector('.coin-stage'), coin = document.querySelector('.coin'), btn = $('#fjFlipBtn'), lead = $('#fjFlipLead');

A.chooseFirst = d => {

A.nextTurn = () => { const pd = S.game.pending; stopClock(); act(() => { pd.cur.turn = 1; }); };

A.fjClock = () => {
  const t = $('#fj-time'), bar = $('#fj-bar'), btn = $('#clockBtn'), sheet = document.querySelector('.sheet.final');
  if (!t || !bar) return;
  stopClock();
  const total = Math.max(5, Number(S.settings.finalSeconds) || 45);
  let left = total;
  if (btn) btn.hidden = true;

A.endRound = () => {
  const pd = S.game.pending, cur = pd.cur;
  stopClock();
  act(() => {
    const [a, b] = cur.order, ca = cur.counts[a] || 0, cb = cur.counts[b] || 0;
    const winner = ca > cb ? a : cb > ca ? b : null;
    const counts = {}; counts[a] = ca; counts[b] = cb;
    pd.rounds.push({ cat: cur.cat, counts, winner, sudden: pd.rounds.length >= 3 });
    if (winner) pd.wins[winner] = (pd.wins[winner] || 0) + 1;
    pd.step = 'roundResult';
    log('Final round ' + pd.rounds.length + ' (' + cur.cat + '): ' + player(a).name + ' ' + ca + ', ' + player(b).name + ' ' + cb + (winner ? ': ' + player(winner).name + ' takes it' : ': tie, nobody gets it'), winner);

A.toResult = () => {

  act(() => {
    const w = player(ms.winner), l = player(ms.loser), bw = pd.wagers[w.id] || 0, bl = pd.wagers[l.id] || 0;
    pd.before = {}; pd.before[w.id] = w.score; pd.before[l.id] = l.score;
    w.score += bw; l.score -= bl;
    pd.matchWinner = w.id; pd.step = 'result';
    log(w.name + ' wins the final ' + (pd.wins[w.id] || 0) + '–' + (pd.wins[l.id] || 0) + ': ' + w.name + ' ' + signed(bw) + ', ' + l.name + ' ' + signed(-bl), w.id);

A.crown = () => {

    const top = Math.max.apply(null, fs.map(p => p.score));
    S.game.over = fs.filter(p => p.score === top).map(p => p.id);

A.finalDone = () => { stopClock(); act(finish); };

function catWheelSvg(cats) {
  const n = cats.length, a = 360 / n, R = 150;
  const pt = (deg, r) => { const t = deg * Math.PI / 180; return (r * Math.sin(t)).toFixed(2) + ',' + (-r * Math.cos(t)).toFixed(2); };
  let h = '<circle r="158" style="fill:var(--stage);stroke:var(--gold);stroke-width:5"/>';
  cats.forEach((c, i) => {
    const ci = (i % 6) + 1, txt = ci === 2 ? 'var(--on-gold)' : 'var(--ink)';
    const label = (c.length > 18 ? c.slice(0, 17) + '…' : c).toUpperCase();
    const fs = Math.max(8, Math.min(14, 112 / (label.length * 0.72))).toFixed(1);
    h += '<path d="M0,0 L' + pt(i * a - a / 2, R) + ' A' + R + ',' + R + ' 0 0 1 ' + pt(i * a + a / 2, R) + ' Z" style="fill:var(--w' + ci + ');stroke:var(--stage);stroke-width:2"/>';
    h += '<g transform="rotate(' + (i * a - 90).toFixed(2) + ')"><text class="wl" x="' + (R * 0.58).toFixed(1) + '" y="0" dy="0.35em" text-anchor="middle" style="fill:' + txt + ';font-size:' + fs + 'px">' + esc(label) + '</text></g>';
  });
  h += '<circle r="26" style="fill:var(--stage);stroke:var(--gold);stroke-width:4"/><text class="wl" y="0" dy="0.35em" text-anchor="middle" style="fill:var(--gold);font-size:13px">FJ</text>';
  return '<svg class="wheel" viewBox="-160 -160 320 320" role="img" aria-label="Category wheel">' + h + '</svg>';
}
function matchBar(pd) {
  const [x, y] = pd.ids.map(player);
  if (!x || !y) return '';
  const n = pd.rounds.length, ms = matchState(pd);
  const live = pd.step === 'spin' || pd.step === 'turn';
  const label = live ? (n >= 3 ? 'Sudden death' : 'Round ' + (n + 1) + ' of 3') : ms.done ? 'Final' : n >= 3 ? 'Tied: sudden death next' : 'After round ' + n;
  return '<div class="matchbar"><span class="mside">' + avatar(x, 'sm') + esc(x.name) + '</span><span class="mscore">' + (pd.wins[x.id] || 0) + ' – ' + (pd.wins[y.id] || 0) + '</span><span class="mside">' + esc(y.name) + avatar(y, 'sm') + '</span></div><p class="sec-label" style="text-align:center">' + label + ' · best 2 out of 3</p>';
}

      }).join('') + '</div>' +

        after += cur.flip
          ? coin + '<p class="lead">' + (cur.flip === 'H' ? 'Heads' : 'Tails') + '. <b>' + esc(decider.name) + '</b> wins the flip and decides: go first or second?</p>' + chooser

function arrowPath(a, b, bend) {

  return 'M' + s[0].toFixed(1) + ',' + s[1].toFixed(1) + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + e[0].toFixed(1) + ',' + e[1].toFixed(1);
}

function arm(el) {

  if (!el || busy || el.disabled) return;

  if (fn) fn(el.dataset, el, e);

  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cat) { const c = S.board.categories.find(x => x.id === t.dataset.cat); if (c) { c.name = t.value; save(); } return; }
  if (t.id === 'ed-title') { S.board.title = t.value; $('#boardTitle').textContent = t.value; save(); return; }
  if (t.id === 'ce-q' || t.id === 'ce-a') {
    const f = findClue(t.dataset.cid); if (!f) return;
    if (t.id === 'ce-q') f.clue.q = t.value; else f.clue.a = t.value;
    f.clue.starter = false; save(); renderBoard(); return;
  }
  if (t.dataset.pname) { const p = player(t.dataset.pname); if (p) { p.name = t.value; save(); renderMain(); } return; }
  if (t.dataset.pcolor) { const p = player(t.dataset.pcolor); if (p) { p.color = safeColor(t.value); save(); renderMain(); } return; }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ed-values') {
    const v = nums(t.value).filter(n => n > 0).slice(0, 12);
    if (v.length) { S.board.values = v; S.board.categories.forEach(c => { while (c.clues.length < v.length) c.clues.push(clue()); }); }
    t.value = S.board.values.join(', ');
    save(); renderBoard(); return;
  }
  if (t.id === 'ce-used') { if (t.checked) S.game.used[t.dataset.cid] = true; else delete S.game.used[t.dataset.cid]; save(); renderBoard(); return; }
  if (t.id === 'st-money') { const v = nums(t.value); S.settings.moneyPrizes = v.length ? v : DEFAULT_SETTINGS.moneyPrizes.slice(); t.value = S.settings.moneyPrizes.join(', '); save(); return; }
  if (t.id === 'st-wagers') { const v = nums(t.value).map(Math.abs).filter(n => n > 0).slice(0, 6); S.settings.pointsWagers = v.length ? v : DEFAULT_SETTINGS.pointsWagers.slice(); t.value = S.settings.pointsWagers.join(', '); save(); return; }
  if (t.id === 'st-wheel') { const v = t.value.split('\n').map(s => s.trim()).filter(Boolean); S.settings.wheel = v.length >= 2 ? v : DEFAULT_SETTINGS.wheel.slice(); t.value = S.settings.wheel.join('\n'); save(); return; }
  if (t.id === 'st-bad') { const v = t.value.split('\n').map(s => s.trim()).filter(Boolean); S.settings.badWheel = v.length >= 2 ? v : DEFAULT_SETTINGS.badWheel.slice(); t.value = S.settings.badWheel.join('\n'); save(); return; }
  if (t.id === 'st-fcats') { const v = t.value.split('\n').map(x => x.trim()).filter(Boolean); S.settings.finalCats = v.length >= 2 ? v : DEFAULT_SETTINGS.finalCats.slice(); t.value = S.settings.finalCats.join('\n'); save(); return; }
  if (t.id === 'st-fsec') { const v = nums(t.value)[0]; S.settings.finalSeconds = v >= 5 ? v : DEFAULT_SETTINGS.finalSeconds; t.value = S.settings.finalSeconds; save(); return; }
  if (t.id === 'st-mystery') { const v = t.value.split('\n').map(s => s.trim()).filter(Boolean); S.settings.mystery = v.length >= 3 ? v : DEFAULT_SETTINGS.mystery.slice(); t.value = S.settings.mystery.join('\n'); save(); return; }
  if (t.id === 'st-china') { const v = nums(t.value).map(Math.abs).filter(n => n > 0); S.settings.chinaBad = v.length ? v : DEFAULT_SETTINGS.chinaBad.slice(); t.value = S.settings.chinaBad.join(', '); save(); return; }
  if (t.dataset.av && t.files && t.files[0]) {
    const p = player(t.dataset.av), file = t.files[0];

      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 128;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);

        save(); render();
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
});

function hostPeer() {

  const h = hostPeer(), hp = h && h.presence;

    ? { msg: ['Can\u2019t connect the buzzer.', fbStatus && fbStatus !== 'Connecting\u2026' ? fbStatus : 'Open the buzzer link the host sent you. It has the room code in it.'] }

  if (transport === 'firebase' && fbStatus && fbStatus !== 'Connecting\u2026') return { msg: ['Can\u2019t connect the buzzer.', fbStatus] };

  const players = cleanPlayers(hp.players), me = players.find(p => p.id === myPid());

  const q = hp.q && typeof hp.q === 'object' ? hp.q : null, b = hp.buzz && typeof hp.buzz === 'object' ? hp.buzz : {};
  const round = Number(b.round) || 0, open = !!b.open && !!q;

  if (!q) { state = 'idle'; label = 'WAIT'; sub = 'No question right now.'; }

/* --- buzzers outside Claude: Firebase Realtime Database ---
   Every open page keeps one node at games/<code>/peers/<device> with its "presence" plus a server

const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

let transport = IN_CLAUDE ? 'claude' : 'firebase';
let fbApp = null, fbStatus = '';

const validDbUrl = u => /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)\/?$/i.test(String(u || '').trim());
function roomCode() {
  if (!S.settings.roomCode) { const abc = 'abcdefghjkmnpqrstuvwxyz23456789'; let c = ''; for (let i = 0; i < 6; i++) c += abc[Math.floor(Math.random() * abc.length)]; S.settings.roomCode = c; save(); }
  return S.settings.roomCode;
}
function buzzerLink() {

}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load failed')); document.head.appendChild(s); });
}
async function loadFirebase() {
  if (window.firebase && window.firebase.database) return;
  await loadScript(FB_SDK + 'firebase-app-compat.js');
  await loadScript(FB_SDK + 'firebase-database-compat.js');
}
function makeFirebaseRoom(db, code) {
  const me = Math.random().toString(36).slice(2, 10);
  const base = db.ref('games/' + code + '/peers'), mine = base.child(me), info = db.ref('.info/connected');
  let myPres = {}, peers = [], online = false;
  const peerFns = [], connFns = [];

    connFns.forEach(f => f(online));
  };

    const v = snap.val() || {};

      const raw = v[k] && typeof v[k] === 'object' ? v[k] : {};

      return Object.freeze({ peer: k, by: null, isMe: k === me, sameTab: k === me, kind: 'viewer', guest: false, presence: Object.freeze(pres), updatedAt: Number(raw.ts) || 0 });

    onConnection: fn => { connFns.push(fn); setTimeout(() => fn(online), 0); return () => {}; },

async function connectFirebase(dbUrl, code) {

    fbApp = firebase.initializeApp({ databaseURL: dbUrl.trim().replace(/\/$/, '') }, 'p3buzz-' + Date.now());

  room.onPeers(ch => { roomPeers = ch.peers; liveRender(); });
  room.onConnection(() => liveRender());

  else { const pid = myPid(); room.presence({ role: 'player', pid: pid || null }).catch(() => {}); }

}

function liveRender() {

async function connectLive() {
  const c = window.claude;
  if (!IN_CLAUDE) {
    if (mode === 'buzzer' && JOIN.code && JOIN.db) { if (validDbUrl(JOIN.db)) { await connectFirebase(JOIN.db, JOIN.code); return; } fbStatus = 'This buzzer link is broken. Ask the host to send it again.'; }
    else if (mode === 'host' && S.settings.dbUrl && validDbUrl(S.settings.dbUrl)) { await connectFirebase(S.settings.dbUrl, roomCode()); return; }

  room.onConnection(() => liveRender(), () => liveRender());

  liveRender();
}
