<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>P3 Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Bungee&family=Shrikhand&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* Layout: TV studio. Red velvet curtains under two sweeping spotlights; the question board sits in a gold marquee frame with chasing bulbs, the map and play-by-play stand beside it, and contestant podiums with LED scoreboards line the bottom. One committed dark look. */
:root{
  --curtain:#5e0b19; --curtain-hi:#9a1b2e; --curtain-lo:#200309;
  --stage:#0c0613; --panel:#170e2a; --panel-2:#23163f; --line:#3f2d68;
  --tile:#1c2db4; --tile-hi:#3149ea; --tile-lo:#101b7c; --tile-used:#080b33;
  --ink:#fff8ec; --ink-dim:#cdbcd8; --ink-faint:#8c78a3;
  --gold:#ffc63a; --gold-hi:#ffe7a1; --gold-deep:#b87709; --gold-dark:#4a2e04; --on-gold:#2a1700;
  --bulb:#fff3c2; --bulb-glow:rgba(255,190,60,.9);
  --led:#07040b;
  --money:#26b862; --money-deep:#13703a; --money-shadow:#0b4524;
  --attack:#f0453f; --wheel:#eef0fa; --points:#ffb82e; --china:#2fb486;
  --good:#3ddc84; --bad:#ff4d5e;
  --coin-hi:#ffe28f; --coin-mid:#e2aa22; --coin-lo:#9c6c08;
  --silver-hi:#ffffff; --silver-mid:#c9cfe0; --silver-lo:#7d859f;
  --w1:#3149ea; --w2:#ffc63a; --w3:#1f9d55; --w4:#e33a35; --w5:#7a4cf5; --w6:#1c93cf; --w-china:#0d3a2e;
  --b1:#8e1723; --b2:#c42a33; --b3:#4b0f1a; --b4:#d9482c; --b-slice:#160408;
  --shade:rgba(4,1,10,.55); --scrim:rgba(6,2,12,.86);
  --f-show:'Shrikhand','Cooper Black','Georgia',serif;
  --f-script:'Yellowtail','Brush Script MT','Segoe Script',cursive;
  --f-display:'Bungee','Arial Black',system-ui,sans-serif;
  --f-num:'Anton',Impact,'Arial Narrow',sans-serif;
  --f-body:'Barlow','Helvetica Neue',Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background-color:var(--curtain-lo)}
body{margin:0;min-height:100vh;background-color:var(--curtain-lo);background-image:radial-gradient(1300px 760px at 50% 34%,rgba(12,6,19,.84),rgba(12,6,19,.52) 55%,rgba(12,6,19,0) 88%),linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 72%,rgba(0,0,0,.6)),repeating-linear-gradient(90deg,var(--curtain-lo) 0,var(--curtain) 24px,var(--curtain-hi) 48px,var(--curtain) 72px,var(--curtain-lo) 96px);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* studio lights */
.lights{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.beam{position:absolute;top:-6vh;width:min(64vw,780px);height:125vh;transform-origin:50% 0;background:linear-gradient(90deg,rgba(255,236,190,0),rgba(255,236,190,.09) 30%,rgba(255,240,205,.15) 50%,rgba(255,236,190,.09) 70%,rgba(255,236,190,0));clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);-webkit-mask-image:linear-gradient(180deg,#000 8%,transparent 92%);mask-image:linear-gradient(180deg,#000 8%,transparent 92%);will-change:transform}
.beam.l{left:calc(12vw - min(32vw,390px));animation:sweepL 10s ease-in-out infinite alternate}
.beam.r{right:calc(12vw - min(32vw,390px));animation:sweepR 12s ease-in-out infinite alternate}
@keyframes sweepL{from{transform:rotate(-32deg)}to{transform:rotate(12deg)}}
@keyframes sweepR{from{transform:rotate(32deg)}to{transform:rotate(-12deg)}}
body.showtime .beam{animation-duration:3.4s;background:linear-gradient(90deg,rgba(255,220,130,0),rgba(255,220,130,.16) 30%,rgba(255,232,170,.26) 50%,rgba(255,220,130,.16) 70%,rgba(255,220,130,0))}
.valance{position:relative;z-index:2;height:36px;pointer-events:none;background:radial-gradient(circle at 50% 0,var(--curtain-hi) 0 15px,var(--curtain) 16px 18px,var(--gold) 19px 21px,transparent 22px) 0 10px/44px 26px repeat-x,linear-gradient(180deg,var(--curtain-hi),var(--curtain) 70%,var(--curtain-lo)) 0 0/100% 12px no-repeat;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.valance::before{content:'';position:absolute;left:0;right:0;top:9px;height:4px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-deep))}

/* marquee bulbs (placed by script around any .marquee) */
.marquee{position:relative}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:1}
.bulb{position:absolute;width:var(--bs,9px);height:var(--bs,9px);margin:calc(var(--bs,9px) / -2) 0 0 calc(var(--bs,9px) / -2);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--bulb) 45%,#f0b23a);box-shadow:0 0 6px 2px var(--bulb-glow);animation:chase 1.2s steps(1,end) infinite;animation-delay:calc(var(--k) * -.4s)}
@keyframes chase{0%{opacity:1}33.33%{opacity:.25;box-shadow:none}}
.marquee.calm .bulb{animation-duration:2.4s;animation-delay:calc(var(--k) * -.8s)}
.marquee.fast .bulb{animation-duration:.6s;animation-delay:calc(var(--k) * -.2s)}

.app{position:relative;z-index:1;max-width:1760px;margin:0 auto;padding-inline:clamp(16px,2.4vw,36px);padding-block:8px 30px;display:grid;gap:18px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.sign{display:inline-flex;align-items:center;gap:12px;padding:13px 24px 15px 15px;border-radius:18px;background:radial-gradient(120% 140% at 50% 0%,#5c0e1e,#2a050d 70%);box-shadow:0 0 0 3px var(--gold-deep),0 0 0 6px var(--gold-dark),0 10px 24px rgba(0,0,0,.55),0 0 40px rgba(255,190,60,.18)}
.sign-word{font-family:var(--f-show);font-size:clamp(30px,3.4vw,46px);line-height:1.05;color:var(--gold);transform:rotate(-4deg);text-shadow:0 2px 0 var(--gold-deep),0 4px 0 #8c1426,0 6px 0 #4a0812,0 0 26px rgba(255,190,60,.45);padding-inline-end:4px}
.sign.small{padding:10px 18px 12px 11px}
.sign.small .sign-word{font-size:27px}
.sign.small .logo-p3{width:38px;height:38px;font-size:15px}
.logo-p3{font-family:var(--f-display);font-size:19px;background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--gold) 55%,var(--gold-deep));color:var(--on-gold);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--gold-dark),inset 0 0 0 3px rgba(255,255,255,.25)}
.brand-text{display:grid;gap:4px;min-width:0}
.logo-word{font-family:var(--f-show);font-size:clamp(24px,2.6vw,34px);line-height:1;color:var(--gold)}
.board-title{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;background:rgba(0,0,0,.4);border:1px solid rgba(255,198,58,.35);padding:5px 11px;border-radius:999px}
.board-title:empty{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.btn{appearance:none;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.55);transition:border-color .15s,color .15s,transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-hi)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,#e9a51c);border-color:var(--gold-deep);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-dark),0 0 18px rgba(255,198,58,.22)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--on-gold);border-color:var(--gold-deep)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.snd.off{color:var(--ink-faint)}
.fj-title{font-family:var(--f-show);font-size:clamp(40px,6.4vw,78px);color:var(--gold);text-align:center;margin:0;line-height:1.05;transform:rotate(-3deg);text-shadow:0 3px 0 var(--gold-deep),0 6px 0 #8c1426,0 9px 0 #3a0610,0 0 40px rgba(255,190,60,.5)}
.fj-cat{text-align:center;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:clamp(16px,2vw,24px);margin:0;color:var(--gold-hi)}
.finalists{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.finalist{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;min-width:0}
.fname{font-family:var(--f-display);font-size:20px;overflow-wrap:anywhere}
.fscore{font-family:var(--f-num);font-size:38px;line-height:1;color:var(--gold);text-shadow:0 0 16px rgba(255,198,58,.45)}
.fscore.neg{color:var(--bad);text-shadow:0 0 16px rgba(255,77,94,.45)}
.fw-row{display:flex;gap:8px;width:100%}
.fw-row .input{flex:1}
.ferr{color:var(--bad);font-size:13.5px;min-height:1.2em;margin:0}
.clock{height:14px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.clock i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-hi));box-shadow:0 0 14px rgba(255,198,58,.6)}
.av.lg{--sz:76px;font-size:28px}
.av.xl{--sz:124px;font-size:44px;border-width:5px;box-shadow:0 0 0 6px var(--gold),0 0 50px rgba(255,198,58,.7);animation:champGlow 1.4s ease-in-out infinite alternate}
@keyframes champGlow{to{box-shadow:0 0 0 6px var(--gold-hi),0 0 90px rgba(255,198,58,.95)}}
.fj-win{font-family:var(--f-show);font-size:clamp(54px,9vw,116px);color:var(--gold);text-align:center;margin:0;line-height:1.05;transform:rotate(-4deg);text-shadow:0 4px 0 var(--gold-deep),0 8px 0 #8c1426,0 12px 0 #3a0610,0 0 60px rgba(255,190,60,.6);animation:winIn .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes winIn{from{transform:rotate(-14deg) scale(.3);opacity:0}}
.winners{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.finalist.champ{background:transparent;border:0}
.champ .fscore{font-size:58px}
.standings{list-style:none;margin:0 auto;padding:0;display:grid;gap:6px;width:min(440px,100%);counter-reset:r}
.standings li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 12px;counter-increment:r}
.standings li::before{content:counter(r);font-family:var(--f-num);font-size:20px;width:22px;color:var(--gold)}
.standings .st-name{flex:1;font-weight:800;min-width:0;overflow-wrap:anywhere}
.standings b{font-family:var(--f-num);font-size:22px;font-weight:400}
.standings b.neg{color:var(--bad)}
#editbar{display:grid;gap:12px}
.matchbar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:17px}
.mside{display:flex;align-items:center;gap:8px}
.mscore{font-family:var(--f-num);font-size:46px;line-height:1;color:var(--gold);font-weight:400;background:var(--led);padding:4px 16px 2px;border-radius:10px;box-shadow:inset 0 0 0 2px #2b1f45;text-shadow:0 0 14px rgba(255,198,58,.6)}
.turn-who{display:grid;justify-items:center;gap:6px}
.clock-num{font-family:var(--f-num);font-size:clamp(48px,6.4vw,74px);line-height:1;text-align:center;margin:0;color:var(--ink);text-shadow:0 0 22px rgba(255,255,255,.35)}
.clock-num.hurry{color:var(--bad);animation:pulseNum .5s ease-in-out infinite alternate}
@keyframes pulseNum{to{transform:scale(1.12)}}
.sheet.timeup .clock-num{color:var(--bad);animation:shake .6s}
.sheet.timeup .clock i{background:var(--bad)}
.tally{font-family:var(--f-num);font-size:clamp(90px,15vw,170px);line-height:1;text-align:center;color:var(--gold);margin:0;text-shadow:0 0 40px rgba(255,198,58,.5)}
.tally.bump{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.tally-btn{font-family:var(--f-display);font-size:clamp(26px,3.6vw,42px);padding:16px 44px;border-radius:20px;background:linear-gradient(180deg,#7cf0b0,var(--good) 45%,#1fae5e);color:#06210f;border:0;cursor:pointer;box-shadow:0 8px 0 var(--money-shadow),0 0 30px rgba(61,220,132,.35);transition:transform .05s}
.tally-btn:active{transform:translateY(4px);box-shadow:0 4px 0 var(--money-shadow)}
.pool-btn.on{border-color:var(--gold);color:var(--gold)}
.btn.live-btn{border-color:var(--good);color:var(--good)}
.btn.live-btn .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.flag.buzz{background:var(--good);color:#06210f}
.judge{position:relative}
.judge .bz-mark{position:absolute;top:-9px;left:-6px;background:var(--gold);color:var(--on-gold);font-family:var(--f-num);font-size:15px;line-height:1;padding:3px 7px;border-radius:999px;box-shadow:0 2px 6px var(--shade)}
.judge .bz-mark:empty{display:none}
.judge.first{box-shadow:inset 0 0 0 3px var(--gold),0 0 24px rgba(255,198,58,.45)}
.buzz-panel{display:grid;gap:10px;background:rgba(0,0,0,.35);border-radius:12px;padding:12px 14px}
.bz-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600}
.bz-note{margin:0;color:var(--ink-dim);font-size:14.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bz-live{display:inline-flex;align-items:center;gap:8px;color:var(--good);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.bz-live .dot{background:var(--good);animation:pulse 1.1s ease-in-out infinite}
.buzz-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:bz}
.buzz-list li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:rgba(10,8,40,.6);counter-increment:bz}
.buzz-list li::before{content:'#' counter(bz);font-family:var(--f-num);font-size:20px;color:var(--ink-dim);width:30px}
.buzz-list li b{flex:1;font-weight:800}
.buzz-list li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-dim);font-weight:700}
.buzz-list li.first{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--on-gold);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.buzz-list li.first::before,.buzz-list li.first span:last-child{color:var(--on-gold)}
.howto{margin:0;padding-left:22px;display:grid;gap:8px;max-width:62ch}
.dev-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dev-list li{display:flex;align-items:center;gap:10px}

/* phone buzzer */
#buzzer{position:relative;z-index:1;min-height:100vh;min-height:100dvh}
.bz{display:grid;grid-template-rows:auto auto 1fr auto;gap:16px;padding-inline:16px;padding-block:16px 28px;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh}
.bz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bz-top-r{display:flex;align-items:center;gap:8px}
.bz-conn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.bz-conn .dot{background:var(--ink-faint)}
.bz-conn.on{color:var(--good)}
.bz-conn.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.bz-me{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,var(--panel-2),var(--panel));border-top:5px solid var(--pc,var(--gold));border-radius:14px;padding:10px 12px;font-family:var(--f-display);font-size:18px;min-width:0;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.bz-me .bz-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz-me b{font-family:var(--f-num);font-weight:400;font-size:26px;color:var(--gold);background:var(--led);padding:2px 10px;border-radius:8px}
.bz-me b.neg,.bz-scores b.neg{color:var(--bad)}
.bz-main{display:grid;justify-items:center;align-content:center;gap:22px;min-width:0}
.bz-q{margin:0;text-align:center;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--gold-hi);font-size:15px;overflow-wrap:anywhere}
.bz-q b{display:block;font-family:var(--f-num);font-weight:400;font-size:50px;letter-spacing:.02em;color:var(--gold);text-shadow:0 0 22px rgba(255,198,58,.55)}
.bz-btn{position:relative;width:min(70vw,44vh,330px);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;font-family:var(--f-display);font-size:clamp(34px,11vw,64px);color:var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.35);background:radial-gradient(circle at 38% 30%,#ff8a8a,#e8202e 42%,#8a0d18 82%);box-shadow:0 16px 0 #4a0710,0 0 0 10px var(--gold),0 0 0 15px var(--gold-dark),0 26px 50px rgba(0,0,0,.55);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .06s,box-shadow .06s;margin-block:18px}
.bz-btn .bulbs{inset:0}
.bz-btn.live{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 16px 0 #4a0710,0 0 0 10px var(--gold-hi),0 0 0 15px var(--gold-dark),0 0 60px rgba(255,80,80,.75)}}
.bz-btn.live:active{transform:translateY(12px);box-shadow:0 4px 0 #4a0710,0 0 0 10px var(--gold),0 0 0 15px var(--gold-dark)}
.bz-btn.idle{background:radial-gradient(circle at 38% 30%,#4a3a72,var(--panel-2) 55%,var(--panel));box-shadow:0 16px 0 #0a0618,0 0 0 10px #5a4a20,0 0 0 15px #2a1d06;color:var(--ink-faint);cursor:default}
.bz-btn.idle .bulb,.bz-btn.out .bulb{animation:none;opacity:.22;box-shadow:none}
.bz-btn.out{background:radial-gradient(circle at 38% 30%,#2a0f1a,var(--b-slice) 70%);box-shadow:0 16px 0 #070104,0 0 0 10px var(--b3),0 0 0 15px #1a0408;color:var(--bad);cursor:default}
.bz-btn.done{background:radial-gradient(circle at 38% 30%,#a5ffcb,var(--good) 45%,var(--money-deep));box-shadow:0 6px 0 var(--money-shadow),0 0 0 10px var(--gold),0 0 0 15px var(--gold-dark),0 0 70px rgba(61,220,132,.6);color:#06210f;text-shadow:none;cursor:default;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bz-sub{margin:0;text-align:center;font-size:18px;font-weight:700;color:var(--ink-dim);text-wrap:balance}
.bz-msg{text-align:center;display:grid;gap:8px;max-width:40ch}
.bz-msg h2{font-family:var(--f-show);font-weight:400;font-size:clamp(28px,8vw,40px);margin:0;color:var(--gold);transform:rotate(-2deg);text-shadow:0 3px 0 #8c1426,0 0 24px rgba(255,190,60,.4)}
.bz-msg p{margin:0;color:var(--ink-dim)}
.bz-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.bz-pick .btn{text-transform:none;letter-spacing:0;font-size:18px;padding:12px;justify-content:flex-start}
.bz-scores{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.bz-scores li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:rgba(23,14,42,.85)}
.bz-scores li.me{box-shadow:inset 0 0 0 2px var(--gold)}
.bz-scores span{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bz-scores b{font-family:var(--f-num);font-weight:400;font-size:18px}
.btn.final-btn{border-color:var(--gold);color:var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 16px rgba(255,198,58,.25)}
.btn.danger{background:linear-gradient(180deg,#ff7b86,var(--bad) 45%,#c42a33);border-color:#7a1020;color:#2a0006;box-shadow:0 4px 0 #4b0f1a}
.btn.danger:hover:not(:disabled){filter:brightness(1.08);color:#2a0006;border-color:#7a1020}
.btn.big{font-size:18px;padding:14px 28px;border-radius:14px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn[data-armed="1"],.mini[data-armed="1"],.cat-del[data-armed="1"]{background:var(--bad);border-color:var(--bad);color:var(--ink)}
.mini{appearance:none;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink-dim);border-radius:6px;font-weight:700;font-size:12px;padding:3px 9px;cursor:pointer;font-variant-numeric:tabular-nums}
.mini:hover{color:var(--gold-hi);border-color:var(--gold-deep)}

/* edit bar */
.editbar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px dashed var(--gold);border-radius:14px;padding:12px 14px}
.editbar .hint{flex:1 1 220px;font-size:14px;color:var(--ink-dim);align-self:center}
.field{display:grid;gap:5px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);min-width:0}
.input{background:var(--stage);border:2px solid var(--line);border-radius:8px;color:var(--ink);font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;padding:8px 10px;min-width:0;width:100%}
.input:focus{border-color:var(--gold);outline:none}
textarea.input{resize:vertical;min-height:96px;line-height:1.4}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:1020px){.stage{grid-template-columns:minmax(0,1fr)}}
.board-frame{padding:18px;border-radius:26px;min-width:0;background:linear-gradient(160deg,#6a4507,#2b1a02 28%,#7a5009 50%,#2b1a02 72%,#6a4507);box-shadow:0 0 0 2px var(--gold-hi),0 0 0 5px var(--gold-deep),0 0 0 8px #1c1001,0 24px 60px rgba(0,0,0,.65),0 0 90px rgba(255,180,40,.16)}
.board-wrap{background:#03051a;border-radius:12px;padding:6px;overflow-x:auto;box-shadow:inset 0 0 0 2px #000,inset 0 0 30px rgba(0,0,0,.8);position:relative;z-index:2}
.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(108px,1fr));gap:6px;perspective:900px}
.cat{min-height:clamp(60px,8.6vh,92px);display:grid;place-items:center;text-align:center;padding:8px;background:linear-gradient(180deg,#2a3ac8,#16218a);border-radius:6px;font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(12px,1.05vw,17px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;color:#fff;text-shadow:0 2px 0 #000;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.35);border-bottom:3px solid var(--gold-deep)}
.cat.untitled{color:var(--ink-faint)}
.cat-edit{position:relative;padding:6px}
.cat-input{text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:14px;padding-right:26px}
.cat-del{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.tile{appearance:none;border:0;border-radius:6px;height:clamp(64px,10.2vh,114px);background:linear-gradient(180deg,var(--tile-hi),var(--tile) 55%,var(--tile-lo));box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 -4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px;transition:transform .14s,filter .14s,box-shadow .14s;position:relative;color:var(--ink);min-width:0;overflow:hidden}
.tile .tv{font-family:var(--f-num);font-size:clamp(28px,3.1vw,50px);line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.65),0 0 18px rgba(255,198,58,.35);letter-spacing:.02em;position:relative}
.tile:not(.tile-edit)::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);transform:translateX(-130%);transition:transform .55s;pointer-events:none}
.tile:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-3px) scale(1.03);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -4px 0 rgba(0,0,0,.35),0 0 0 2px var(--gold),0 8px 20px rgba(0,0,0,.5);z-index:1}
.tile:hover:not(:disabled)::after{transform:translateX(130%)}
.tile:disabled{cursor:not-allowed;filter:saturate(.55) brightness(.72)}
.tile.used{background:var(--tile-used);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 24px rgba(0,0,0,.6);cursor:default}
.tile.used::after{display:none}
.tile.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.tile.empty .tv{color:var(--ink-faint);text-shadow:none}
.tile .tag{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.tile-edit{font-size:12.5px;line-height:1.25;text-align:center}
.tile-edit .prev{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-edit .tv{font-size:22px}
.tile-edit.was-used::after{content:'played';position:absolute;top:3px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tile-edit.no-answer::before{content:'no answer';position:absolute;bottom:3px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bad)}
.board.intro .tile,.board.intro .cat{animation:tileIn .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes tileIn{from{transform:rotateX(-95deg) scale(.85);opacity:0;filter:brightness(2.2)}}

/* side */
.side{display:grid;gap:18px;min-width:0}
.panel{background:linear-gradient(180deg,rgba(35,22,63,.94),rgba(20,12,38,.96));border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px rgba(255,198,58,.12),0 18px 40px rgba(0,0,0,.5);min-width:0}
.panel-h{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.04em;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel-h::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:pulse 1.4s ease-in-out infinite}
.callout{display:grid;gap:10px;background:rgba(0,0,0,.35);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.callout p{margin:0}
.callout.go{border:2px solid var(--gold);box-shadow:0 0 22px rgba(255,198,58,.2)}
.callout b{font-weight:800;color:var(--gold-hi)}
.move-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.move-btn{border-color:var(--sc)}
.move-btn .dot{background:var(--sc);box-shadow:0 0 8px var(--sc)}
.map{position:relative;width:100%;aspect-ratio:600/440;max-width:100%}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arrow{fill:none;stroke:var(--ink-faint);stroke-width:3;stroke-linecap:round;opacity:.8}
.arrow.hi{stroke:var(--gold);stroke-width:4;stroke-dasharray:10 8;animation:march .8s linear infinite;opacity:1;filter:drop-shadow(0 0 4px rgba(255,198,58,.8))}
@keyframes march{to{stroke-dashoffset:-18}}
.ah-fill{fill:var(--ink-faint)}
.ah-hi-fill{fill:var(--gold)}
.spot .ring{fill:#0b0716;stroke-width:8;transition:fill .2s}
.spot .glow{fill:none;stroke:none}
.spot-money .ring{stroke:var(--money)}
.spot-attack .ring{stroke:var(--attack)}
.spot-wheel .ring{stroke:var(--wheel)}
.spot-points .ring{stroke:var(--points)}
.spot-china .ring{stroke:var(--china)}
.spot .sb{fill:var(--bulb);animation:twinkle 1.6s steps(1,end) infinite}
.spot .sb.odd{animation-delay:-.8s}
@keyframes twinkle{0%{opacity:1}50%{opacity:.25}}
.spot.target{cursor:pointer}
.spot.target .ring{fill:#1d1640}
.spot.target .sb{animation-duration:.5s}
.spot.target .sb.odd{animation-delay:-.25s}
.spot.target:hover .ring,.spot.target:focus .ring{fill:var(--tile)}
.spot.target .glow{stroke:var(--gold);stroke-width:4;animation:pulse 1.1s ease-in-out infinite}
.spot:focus{outline:none}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.sl{font-family:var(--f-display);fill:var(--ink);font-size:19px;text-anchor:middle;dominant-baseline:central}
.sl.money{font-size:30px;fill:var(--money)}
.ss{font-family:var(--f-body);font-weight:800;font-size:10px;letter-spacing:.16em;fill:var(--ink-dim);text-anchor:middle;dominant-baseline:central}
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:7.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--pc);background:var(--pc);box-shadow:0 0 0 2px var(--gold-dark),0 5px 12px rgba(0,0,0,.6);overflow:hidden;transition:left .8s cubic-bezier(.45,1.45,.5,1),top .8s cubic-bezier(.45,1.45,.5,1);display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(10px,1.1vw,16px);color:var(--ink)}
.token img{width:100%;height:100%;object-fit:cover;display:block}
.token.active{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,198,58,.8),0 5px 12px rgba(0,0,0,.6);animation:bob 1s ease-in-out infinite;z-index:2}
@keyframes bob{50%{transform:translate(-50%,-64%)}}
.log{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;color:var(--ink-dim);max-height:232px;overflow:auto}
.log li{display:flex;gap:9px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.log li:first-child{color:var(--ink);font-weight:700;animation:logIn .5s ease-out}
@keyframes logIn{from{transform:translateX(-10px);opacity:0;color:var(--gold-hi)}}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;background:var(--pc,var(--ink-faint))}

/* podiums */
.podiums{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 18px;padding-bottom:10px}
.podium{position:relative;background:linear-gradient(180deg,#2e1d55,#1b1135 55%,#130b27);border-radius:16px 16px 8px 8px;padding:16px 14px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"av name" "av spot" "score score" "cash cash" "adj adj";gap:3px 12px;align-items:center;border-top:7px solid var(--pc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),0 0 0 2px #0b0616,0 18px 34px rgba(0,0,0,.55);margin-bottom:9px;transition:box-shadow .3s}
.podium::after{content:'';position:absolute;left:12px;right:12px;bottom:-9px;height:9px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,var(--gold),var(--gold-deep) 60%,var(--gold-dark));box-shadow:0 6px 14px rgba(0,0,0,.5)}
.podium.control{box-shadow:inset 0 0 0 2px var(--gold),0 0 0 2px #0b0616,0 0 34px rgba(255,198,58,.35),0 18px 34px rgba(0,0,0,.55)}
.av-wrap{grid-area:av;position:relative;display:grid}
.crown{position:absolute;left:50%;top:-17px;width:30px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 2px 0 var(--gold-dark)) drop-shadow(0 0 6px rgba(255,198,58,.8));animation:crownBob 1.8s ease-in-out infinite;z-index:1}
.crown svg{display:block;width:100%;height:auto;fill:var(--gold);stroke:var(--gold-dark);stroke-width:1.2;stroke-linejoin:round}
@keyframes crownBob{50%{transform:translateX(-50%) translateY(-3px) rotate(6deg)}}
.pod-name{grid-area:name;font-family:var(--f-display);font-size:17px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:64px}
.pod-spot{grid-area:spot;font-size:13.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pod-score{grid-area:score;font-family:var(--f-num);font-size:clamp(36px,3.3vw,52px);line-height:1;text-align:center;color:var(--gold);background:radial-gradient(circle,rgba(255,198,58,.07) 1px,transparent 1.6px) 0 0/5px 5px,var(--led);border-radius:10px;padding:10px 10px 8px;margin-top:8px;letter-spacing:.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,198,58,.6);box-shadow:inset 0 0 0 2px #2b1f45,inset 0 6px 14px rgba(0,0,0,.8)}
.pod-score.neg{color:var(--bad);text-shadow:0 0 14px rgba(255,77,94,.6)}
.pod-score.up{animation:up 1s}
.pod-score.down{animation:down 1s}
@keyframes up{0%{color:var(--good);transform:scale(1.1);text-shadow:0 0 26px var(--good)}}
@keyframes down{0%{color:var(--bad);transform:scale(.92);text-shadow:0 0 26px var(--bad)}}
.pod-cash{grid-area:cash;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px;font-weight:800;color:var(--ink-dim);margin-top:10px}
.pod-cash b{color:var(--good);font-weight:800;margin-left:2px;font-variant-numeric:tabular-nums}
.pod-cash .mini{font-size:14px;padding:4px 12px}
.mini:disabled{opacity:.35;cursor:default}
.pod-adj{grid-area:adj;display:flex;gap:6px;justify-content:center;margin-top:6px}
.chip{position:absolute;top:12px;right:12px;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;box-shadow:0 0 12px rgba(255,198,58,.5)}
.av{--sz:54px;width:var(--sz);height:var(--sz);border-radius:50%;overflow:hidden;border:3px solid var(--pc);background:var(--pc);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none;color:var(--ink);box-shadow:0 0 0 2px var(--gold-dark)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{--sz:32px;border-width:2px;font-size:13px;box-shadow:none}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,rgba(24,10,36,.74),rgba(5,2,10,.93));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet{width:min(940px,100%);border-radius:22px;padding:clamp(18px,3vw,36px);display:grid;gap:clamp(14px,2vw,22px);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,198,58,.14),0 30px 80px rgba(0,0,0,.65);animation:pop .3s cubic-bezier(.3,1.4,.5,1);min-width:0}
.sheet.same{animation:none}
@keyframes pop{from{transform:scale(.92);opacity:.4}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.6vw,30px);margin:0;line-height:1.1;color:var(--gold)}
.sheet h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.sec-label{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0}
.muted{color:var(--ink-dim);font-weight:500}

.sheet.clue{width:min(1060px,100%);padding:clamp(26px,3.2vw,42px);background:radial-gradient(900px 320px at 50% -12%,rgba(140,165,255,.38),transparent 70%),linear-gradient(180deg,var(--tile-hi),var(--tile) 55%,var(--tile-lo));border:3px solid var(--gold-deep);box-shadow:0 0 0 3px var(--gold-dark),0 0 70px rgba(255,190,60,.2),0 30px 80px rgba(0,0,0,.7)}
.sheet.final{background:radial-gradient(900px 360px at 50% -10%,rgba(255,198,58,.28),transparent 70%),linear-gradient(180deg,#26155a,#160c38 55%,#0d0726)}
.clue-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.clue-cat{font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase;font-size:15px;color:var(--gold-hi);overflow-wrap:anywhere;min-width:0}
.clue-val{font-family:var(--f-num);font-size:40px;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.6),0 0 18px rgba(255,198,58,.45)}
.clue-text{margin:0;font-weight:800;text-transform:uppercase;font-size:clamp(22px,3.3vw,46px);line-height:1.18;text-align:center;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.6);padding-block:clamp(6px,3vh,34px);overflow-wrap:anywhere}
.answer-box{display:grid;gap:6px;justify-items:center;text-align:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.answer{margin:0;font-size:clamp(20px,2.4vw,32px);font-weight:800;color:var(--gold);overflow-wrap:anywhere;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 20px rgba(255,198,58,.4)}
.judges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.judge{display:flex;align-items:center;gap:8px;background:rgba(3,5,30,.5);border-radius:12px;padding:8px 10px;min-width:0}
.jname{flex:1;min-width:0;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jbtn{appearance:none;width:44px;height:44px;border-radius:12px;border:0;cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .1s}
.jbtn:hover{transform:scale(1.08)}
.jbtn:active{transform:translateY(2px)}
.jbtn.ok{background:linear-gradient(180deg,#7cf0b0,var(--good));color:#06210f;box-shadow:0 3px 0 var(--money-shadow)}
.jbtn.no{background:linear-gradient(180deg,#ff8a94,var(--bad));color:#2a0006;box-shadow:0 3px 0 #4b0f1a}
.jbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.judge.is-wrong{opacity:.65}
.jwrong{font-family:var(--f-num);color:var(--bad);font-size:22px}

.sheet.action{border:3px solid var(--sc);background:radial-gradient(700px 300px at 50% 0%,color-mix(in srgb,var(--sc) 26%,transparent),transparent 72%),linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 50px color-mix(in srgb,var(--sc) 28%,transparent),0 30px 80px rgba(0,0,0,.65)}
.act-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.act-spot{font-family:var(--f-show);font-size:clamp(30px,3.6vw,46px);line-height:1.1;color:var(--sc);transform:rotate(-3deg);transform-origin:left center;text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 24px color-mix(in srgb,var(--sc) 45%,transparent)}
.act-who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;min-width:0}
.act-why{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.lead{margin:0;text-align:center;font-size:clamp(18px,2vw,24px);font-weight:600;text-wrap:balance}
.big-result{font-family:var(--f-num);font-size:clamp(60px,9vw,112px);line-height:1;text-align:center;color:var(--gold);margin:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1);text-shadow:0 5px 0 rgba(0,0,0,.5),0 0 40px rgba(255,198,58,.5)}
.big-result.neg{color:var(--bad);text-shadow:0 5px 0 rgba(0,0,0,.5),0 0 40px rgba(255,77,94,.5)}
.big-result.zero{color:var(--ink);text-shadow:0 5px 0 rgba(0,0,0,.5)}
.choose{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choose .btn{text-transform:none;letter-spacing:0;font-size:16px;padding:8px 14px 8px 8px}

.picks{display:flex;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap;perspective:900px}
.pick{appearance:none;border:0;background:none;padding:0;width:clamp(92px,20vw,160px);aspect-ratio:3/4;max-width:100%;cursor:pointer}
.pick:disabled{cursor:default}
.pick-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .25s}
.pick:hover:not(:disabled) .pick-in{transform:translateY(-10px) rotate(-2deg)}
.pick-front,.pick-back{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pick-front{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.25),transparent 60%),linear-gradient(160deg,var(--money),var(--money-deep));font-family:var(--f-show);font-size:clamp(48px,7.4vw,78px);color:var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.4);box-shadow:0 10px 0 var(--money-shadow),inset 0 0 0 4px var(--gold),inset 0 0 0 7px rgba(0,0,0,.25)}
.pick-back{transform:rotateY(180deg);background:var(--stage);border:3px solid var(--money);font-family:var(--f-num);font-size:clamp(28px,4.4vw,48px);color:var(--good)}
.pick.open .pick-in{animation:flip .6s cubic-bezier(.4,1.4,.5,1) both}
.pick.open:not(.chosen) .pick-in{animation-delay:.6s}
.pick.open:not(.chosen){opacity:.6}
.pick.chosen .pick-back{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 0 50px color-mix(in srgb,var(--gold) 55%,transparent)}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}

.coin-stage{display:grid;place-items:center;height:230px;perspective:800px}
.coin-lift{display:grid;place-items:center}
.coin-stage.tossing .coin-lift{animation:toss var(--dur,2.2s) cubic-bezier(.3,.7,.4,1)}
@keyframes toss{0%{transform:translateY(0)}45%{transform:translateY(-90px) scale(1.15)}100%{transform:translateY(0)}}
.coin{width:160px;height:160px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--f-display);font-size:22px}
.face.heads{background:radial-gradient(circle at 35% 30%,var(--coin-hi),var(--coin-mid) 55%,var(--coin-lo));color:var(--on-gold);box-shadow:inset 0 0 0 9px color-mix(in srgb,var(--coin-lo) 60%,transparent),0 0 30px rgba(255,198,58,.35)}
.face.tails{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,var(--silver-hi),var(--silver-mid) 55%,var(--silver-lo));color:var(--stage);box-shadow:inset 0 0 0 9px color-mix(in srgb,var(--silver-lo) 60%,transparent),0 0 30px rgba(255,255,255,.25)}

.flag{display:inline-block;margin-left:6px;font-family:var(--f-body);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:999px;vertical-align:middle}
.flag.shield{background:var(--good);color:#06210f}
.flag.curse{background:var(--bad);color:#2a0006}
.flag.life{background:var(--gold);color:var(--on-gold)}
.flag.frozen{background:var(--w6);color:#021620}
.flag.link{background:var(--w5);color:var(--ink)}
.pick.mbox .pick-front{background:linear-gradient(90deg,transparent 44%,var(--gold) 44% 56%,transparent 56%),linear-gradient(0deg,transparent 58%,var(--gold) 58% 68%,transparent 68%),radial-gradient(circle at 50% 30%,rgba(255,255,255,.2),transparent 60%),linear-gradient(160deg,var(--china),var(--w-china));box-shadow:0 10px 0 var(--b-slice),inset 0 0 0 3px var(--gold-deep);display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;gap:0}
.pick.mbox .pick-front span{text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 16px rgba(0,0,0,.6)}
.pick.mbox .pick-front small{font-size:.42em;color:var(--gold-hi);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.pick.mbox:not(:disabled) .pick-in{animation:jiggle 1.6s ease-in-out infinite}
.pick.mbox:nth-child(2):not(:disabled) .pick-in{animation-delay:-.5s}
.pick.mbox:nth-child(3):not(:disabled) .pick-in{animation-delay:-1s}
@keyframes jiggle{0%,70%,100%{transform:none}76%{transform:rotate(-5deg)}82%{transform:rotate(5deg)}88%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.pick.mbox .pick-back{border-color:var(--china);color:var(--ink);font-family:var(--f-display);font-size:clamp(13px,1.8vw,19px);line-height:1.15;padding:10px;text-align:center}
.pick.mbox.chosen .pick-back{border-color:var(--gold);color:var(--gold)}
.wheel-box{position:relative;width:min(450px,80vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel-box .bulbs{z-index:2}
.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 26px rgba(0,0,0,.6))}
.wheel .peg{fill:var(--gold-hi);stroke:var(--gold-dark);stroke-width:1.2}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);transform-origin:50% 0;width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:38px solid var(--gold);filter:drop-shadow(0 3px 0 var(--coin-lo)) drop-shadow(0 0 8px rgba(255,198,58,.6));z-index:3}
.pointer.bad{border-top-color:var(--bad);filter:drop-shadow(0 3px 0 var(--b3)) drop-shadow(0 0 8px rgba(255,77,94,.6))}
.pointer.flick{animation:flick .14s ease-out}
@keyframes flick{40%{transform:translateX(-50%) rotate(-24deg)}}
.sheet.bad-sheet{background:radial-gradient(640px 300px at 50% 0%,color-mix(in srgb,var(--bad) 30%,transparent),transparent 72%),repeating-linear-gradient(135deg,rgba(0,0,0,.18) 0 14px,transparent 14px 28px),var(--b-slice)}
.sheet.bad-sheet .act-spot{animation:shake .6s}
.wl{font-family:var(--f-display)}

.odds{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.odds span{padding:5px 12px;border-radius:999px;border:2px solid}
.odds-lose{color:var(--bad);border-color:var(--bad)}
.odds-win{color:var(--good);border-color:var(--good)}
.wagers{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.wagers .btn{font-family:var(--f-num);font-size:26px;letter-spacing:.03em;padding:10px 24px;font-weight:400}
.die-stage{display:grid;place-items:center;height:190px}
.die{width:124px;height:124px;border-radius:24px;background:linear-gradient(145deg,var(--silver-hi),var(--silver-mid));box-shadow:inset 0 -7px 0 var(--silver-lo),0 14px 30px rgba(0,0,0,.5);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px}
.pip{width:22px;height:22px;border-radius:50%;background:var(--stage);place-self:center;visibility:hidden}
.pip.on{visibility:visible}
.die.rolling{animation:tumble .4s linear infinite}
.die.win{box-shadow:inset 0 -7px 0 var(--silver-lo),0 0 0 6px var(--good),0 0 50px color-mix(in srgb,var(--good) 55%,transparent);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.die.lose{box-shadow:inset 0 -7px 0 var(--silver-lo),0 0 0 6px var(--bad),0 0 50px color-mix(in srgb,var(--bad) 50%,transparent);animation:shake .6s}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-22px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-14px)}100%{transform:rotate(360deg) translateY(0)}}
.chyna{font-family:var(--f-show);font-size:clamp(52px,9.6vw,118px);text-align:center;margin:0;color:var(--china);line-height:1.05;animation:shake .7s;text-shadow:0 4px 0 var(--w-china),0 8px 0 rgba(0,0,0,.5),0 0 50px rgba(47,180,134,.55)}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-14px) rotate(-3deg)}30%{transform:translateX(12px) rotate(3deg)}45%{transform:translateX(-9px) rotate(-2deg)}60%{transform:translateX(7px) rotate(1deg)}75%{transform:translateX(-3px)}}
.sheet.shake{animation:shake .5s}

.players-list{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prow .input{flex:1 1 160px;width:auto}
.av-up{cursor:pointer;position:relative;display:inline-grid}
.av-up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.av-up::after{content:'photo';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--stage);color:var(--ink-dim);border-radius:4px;padding:0 4px}
input[type=color]{width:46px;height:40px;padding:2px;border:2px solid var(--line);border-radius:8px;background:var(--stage);cursor:pointer}
.help{font-size:13.5px;color:var(--ink-dim);margin:2px 0 0;letter-spacing:0;text-transform:none;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.status{font-size:14px;color:var(--good);min-height:1.4em;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--gold)}

.rules{display:grid;gap:18px}
.rules ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.rules li b{font-weight:800}
.rules .spots{list-style:none;padding:0}
.rules .spots li{display:flex;gap:10px;align-items:baseline}
.rules .spots .dot{width:12px;height:12px;transform:translateY(1px)}

/* effects layer */
.fx-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:63;pointer-events:none}
.fx-flash{position:fixed;inset:0;z-index:62;pointer-events:none;opacity:0}
.fx-flash.good{background:radial-gradient(circle at 50% 50%,rgba(61,220,132,0) 30%,rgba(61,220,132,.5));animation:flash .75s ease-out}
.fx-flash.bad{background:radial-gradient(circle at 50% 50%,rgba(255,77,94,0) 30%,rgba(255,77,94,.55));animation:flash .75s ease-out}
.fx-flash.gold{background:radial-gradient(circle at 50% 40%,rgba(255,226,140,.35),rgba(255,198,58,.12) 60%,rgba(255,198,58,0));animation:flash 1s ease-out}
.fx-flash.china{background:radial-gradient(circle at 50% 50%,rgba(47,180,134,0) 25%,rgba(47,180,134,.5));animation:flash 1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.fx-stamp{position:fixed;left:50%;top:42%;z-index:64;pointer-events:none;font-family:var(--f-show);font-size:clamp(54px,11vw,140px);line-height:1.1;white-space:nowrap;opacity:0;transform:translate(-50%,-50%)}
.fx-stamp.go{animation:stamp 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
.fx-stamp.good{color:var(--good);text-shadow:0 5px 0 #0b4524,0 10px 0 rgba(0,0,0,.45),0 0 50px rgba(61,220,132,.65)}
.fx-stamp.bad{color:var(--bad);text-shadow:0 5px 0 #4b0f1a,0 10px 0 rgba(0,0,0,.45),0 0 50px rgba(255,77,94,.65)}
.fx-stamp.gold{color:var(--gold);text-shadow:0 5px 0 var(--gold-deep),0 10px 0 #8c1426,0 0 50px rgba(255,190,60,.7)}
.fx-stamp.china{color:var(--china);text-shadow:0 5px 0 var(--w-china),0 10px 0 rgba(0,0,0,.45),0 0 50px rgba(47,180,134,.65)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-10deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9) rotate(-6deg)}}
.fx-delta{position:fixed;z-index:65;transform:translate(-50%,-50%);font-family:var(--f-num);font-size:clamp(30px,3vw,46px);letter-spacing:.02em;pointer-events:none;white-space:nowrap;animation:deltaUp 1.5s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 3px 0 rgba(0,0,0,.65),0 0 20px currentColor}
.fx-delta.up{color:var(--good)}
.fx-delta.down{color:var(--bad)}
@keyframes deltaUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}

@keyframes ovIn{from{opacity:0}}

.bz-cash{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(19,112,58,.35),rgba(11,69,36,.35));border:2px solid var(--money-deep);border-radius:14px;padding:10px 12px;font-weight:800;font-size:18px;color:var(--ink)}

.title-screen{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;background:radial-gradient(1100px 720px at 50% 42%,rgba(12,6,19,.5),rgba(12,6,19,.9) 78%)}

@keyframes neonOn{0%{opacity:0}12%{opacity:1}16%{opacity:.15}24%{opacity:1}31%{opacity:.35}40%,100%{opacity:1}}
.ts-sign .logo-p3{width:clamp(62px,10vw,112px);height:clamp(62px,10vw,112px);font-size:clamp(24px,4vw,44px);box-shadow:0 5px 0 var(--gold-dark),inset 0 0 0 4px rgba(255,255,255,.25)}
.ts-word{font-family:var(--f-show);font-size:clamp(56px,11vw,130px);line-height:1.08;color:var(--gold);transform:rotate(-4deg);padding-inline-end:6px;text-shadow:0 3px 0 var(--gold-deep),0 7px 0 #8c1426,0 11px 0 #4a0812,0 0 46px rgba(255,190,60,.5)}
@keyframes signDrop{from{transform:translateY(-90px) scale(.9);opacity:0}}
.ts-sub{margin:0;font-family:var(--f-display);font-size:clamp(16px,2vw,22px);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi);background:rgba(0,0,0,.45);border:2px solid var(--gold-deep);border-radius:999px;padding:4px 16px;box-shadow:0 0 18px rgba(255,198,58,.25);animation:menuIn .5s 1.25s both}

/* "Your host" intro */
.host-stage{position:relative;min-height:100%;display:grid;align-content:center;justify-items:center;gap:clamp(8px,2vh,18px);padding-inline:16px;padding-block:calc(30px + env(safe-area-inset-top,0px)) 30px;background:rgba(4,2,9,.86);overflow:hidden;text-align:center;isolation:isolate}
.hs-beam{position:absolute;top:-12vh;width:min(76vw,960px);height:125vh;transform-origin:50% 0;background:linear-gradient(90deg,rgba(255,240,200,0),rgba(255,240,200,.13) 32%,rgba(255,246,222,.24) 50%,rgba(255,240,200,.13) 68%,rgba(255,240,200,0));clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);-webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 96%);mask-image:linear-gradient(180deg,#000 10%,transparent 96%);pointer-events:none;z-index:-1}

@keyframes swayR{from{transform:rotate(30deg)}to{transform:rotate(22deg)}}

.host-fig::after{content:'';position:absolute;left:50%;bottom:-5%;width:190%;height:24%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,236,190,.42),rgba(255,236,190,.1) 55%,transparent 72%);z-index:-1}

.hf-bob{display:grid;justify-items:center;animation:bob2 1.1s 2.7s ease-in-out infinite alternate}

.hf-head{position:relative;z-index:1;width:74%;aspect-ratio:1;max-width:100%;border-radius:50%;padding:5px;background:conic-gradient(#38a8ff,#7b5cff,#ff3df0,#7b5cff,#38a8ff);box-shadow:0 0 26px rgba(80,140,255,.85),0 0 64px rgba(255,61,240,.55);animation:headFlick 1.1s 1.75s both}

@keyframes headFlick{0%{filter:brightness(.15)}10%{filter:brightness(1.5)}20%{filter:brightness(.3)}34%{filter:brightness(1.35)}44%{filter:brightness(.55)}60%,100%{filter:brightness(1)}}
.hf-body{display:block;width:100%;height:auto;margin-top:-5%;overflow:visible;filter:drop-shadow(0 0 4px #7b5cff) drop-shadow(0 0 12px rgba(255,61,240,.7))}
.hf-body .lim{fill:none;stroke:url(#hfNeon);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.hf-wave{transform-origin:110px 56px;animation:wave .5s 2.6s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.hs-name{position:relative;padding:clamp(14px,2vw,22px) clamp(28px,4vw,54px);border-radius:26px;max-width:100%;background:radial-gradient(120% 140% at 50% 0%,#5c0e1e,#2a050d 70%);box-shadow:0 0 0 4px var(--gold-deep),0 0 0 8px var(--gold-dark),0 20px 50px rgba(0,0,0,.6),0 0 90px rgba(255,190,60,.35);animation:nameIn .7s 2.45s cubic-bezier(.2,1.5,.4,1) both}
.hs-name .hs-text{display:block;font-family:var(--f-show);font-size:clamp(44px,9vw,108px);line-height:1.12;color:var(--gold);transform:rotate(-4deg);white-space:nowrap;text-shadow:0 3px 0 var(--gold-deep),0 7px 0 #8c1426,0 11px 0 #4a0812,0 0 54px rgba(255,190,60,.65)}
@keyframes nameIn{from{transform:scale(3) rotate(-8deg);opacity:0}}
.hs-go{animation:menuIn .5s 3.3s both}
.rules-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn.narr-btn{border-color:var(--gold-deep);color:var(--gold-hi)}
.narr-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.narr-pick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.narr-pick .input{width:auto;padding:7px 10px;font-size:14px}
.narr-who{font-family:var(--f-display);font-size:13px;color:var(--good);min-width:9ch}
.rules > section{border-radius:14px;padding:10px 12px;margin:-10px -12px;transition:background .3s,box-shadow .3s}
.rules > section.reading{background:rgba(255,198,58,.08);box-shadow:inset 4px 0 0 var(--gold),0 0 30px rgba(255,198,58,.12)}
.rules > section.reading h3{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}.bulb,.spot .sb{animation:none!important;opacity:1}.beam{animation:none!important}.fx-stamp,.fx-flash,.fx-delta{display:none}.hs-beam{display:none}}
@media (max-width:520px){.pod-name{padding-right:0}.chip{position:static;grid-column:1/-1;justify-self:start;margin-top:4px}.sign{padding:11px 18px 13px 12px}.sign-word{font-size:30px}.logo-p3{width:40px;height:40px;font-size:16px}.board-frame{padding:14px;border-radius:20px}}
</style></head><body>

function parseSlice(str, onBad) {
  const t = String(str).trim();
  let m;
  if (/^ch[iy]+n+a+!*$/i.test(t)) return { type: 'china', label: 'CHYYYNA' };
  if (!onBad && /^bad\s*wheel$/i.test(t)) return { type: 'bad', label: 'BAD WHEEL' };
  if (!onBad && /^(double|x2|2x)$/i.test(t)) return { type: 'double', label: 'DOUBLE' };
  if (!onBad && (m = t.match(/^steal\s*(\d+)$/i))) return { type: 'steal', n: +m[1], label: 'STEAL ' + m[1] };
  if ((m = t.match(/^give\s*(\d+)$/i))) return { type: 'give', n: +m[1], label: 'GIVE ' + m[1] };
  if (/^(half|lose half)$/i.test(t)) return { type: 'half', label: 'LOSE HALF' };
  if (/^nothing$/i.test(t)) return { type: 'nothing', label: 'NOTHING' };
  if (/^(extra\s*life|\+?1\s*life)$/i.test(t)) return { type: 'life', label: 'EXTRA LIFE' };
  if (/^good\s*wheel$/i.test(t)) return { type: 'good', label: 'GOOD WHEEL' };
  if (/^(pick\s*a\s*player|link|ride\s*along)$/i.test(t)) return { type: 'link', label: 'PICK A PLAYER' };
  if (/^(frozen|freeze)$/i.test(t)) return { type: 'freeze', label: 'FROZEN' };
  if (/^meet\s*trump$/i.test(t)) return { type: 'tax', pct: 5, label: 'MEET TRUMP' };
  if ((m = t.match(/^tax\s*(\d+)\s*%?$/i))) return { type: 'tax', pct: +m[1], label: 'TAX ' + m[1] + '%' };
  if (/^swap\s*(w\/|with)?\s*(the\s*)?last(\s*place)?$/i.test(t)) return { type: 'swaplast', label: 'SWAP W/ LAST' };
  if (/^swap(\s*scores?)?$/i.test(t)) return { type: 'swap', label: 'SWAP SCORES' };
  if (/^free\s*move$/i.test(t)) return { type: 'free', label: 'FREE MOVE' };
  if (/^shield$/i.test(t)) return { type: 'shield', label: 'SHIELD' };
  if (/^curse[d]?$/i.test(t)) return { type: 'curse', label: 'CURSE' };
  if (/^(extra\s*spin|spin\s*again)$/i.test(t)) return { type: 'again', label: 'SPIN AGAIN' };
  if (/^back\s*to\s*(\$\$\$|start)$/i.test(t)) return { type: 'start', label: 'BACK TO $$$' };
  if ((m = t.match(/^(everyone(\s*else)?|all\s*others|others)\s*\+?\s*(\d+)$/i))) return { type: 'others', n: +m[3], label: 'OTHERS +' + m[3] };
  if ((m = t.match(/^([+\-−]?)\s*(\d+)$/))) {

  }

}

  const sorted = S.players.slice().sort((a, b) => b.score - a.score);

  const cut = sorted[1].score;
  const above = sorted.filter(p => p.score > cut).map(p => p.id);
  const tied = sorted.filter(p => p.score === cut).map(p => p.id);
  if (above.length + tied.length === 2) return { sure: above.concat(tied), pool: [] };

function arrowPath(a, b, bend) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const cx = (a.x + b.x) / 2 + nx * bend, cy = (a.y + b.y) / 2 + ny * bend;
  const toward = (s, d) => { const vx = cx - s.x, vy = cy - s.y, l = Math.hypot(vx, vy) || 1; return [s.x + vx / l * d, s.y + vy / l * d]; };
  const s = toward(a, a.r + 5), e = toward(b, b.r + 7);
  return 'M' + s[0].toFixed(1) + ',' + s[1].toFixed(1) + ' Q' + cx.toFixed(1) + ',' + cy.toFixed(1) + ' ' + e[0].toFixed(1) + ',' + e[1].toFixed(1);
}

function renderTokens(mover) {
  const wrap = $('#tokens'), groups = {}, seen = new Set();
  S.players.forEach(p => { (groups[p.spot] = groups[p.spot] || []).push(p); });
  Object.keys(groups).forEach(spot => {
    const s = SPOTS[spot] || SPOTS.money, list = groups[spot], n = list.length;
    list.forEach((p, k) => {
      const ang = (s.tok + (k - (n - 1) / 2) * 40) * Math.PI / 180, R = s.r + 6;
      const x = s.x + R * Math.cos(ang), y = s.y + R * Math.sin(ang);
      let el = wrap.querySelector('[data-pid="' + p.id + '"]');
      if (!el) { el = document.createElement('div'); el.className = 'token'; el.dataset.pid = p.id; wrap.appendChild(el); }
      const sig = p.avatar.length + ':' + p.name + ':' + p.color;
      if (el.dataset.sig !== sig) { el.innerHTML = avInner(p); el.dataset.sig = sig; el.title = p.name; el.style.setProperty('--pc', safeColor(p.color)); }
      el.style.left = (x / 600 * 100) + '%';
      el.style.top = (y / 440 * 100) + '%';
      el.classList.toggle('active', !!(mover && mover.id === p.id));
      seen.add(p.id);
    });
  });
  wrap.querySelectorAll('.token').forEach(el => { if (!seen.has(el.dataset.pid)) el.remove(); });
}

function tweenScore(pid, from, to) {
  if (reduced || from === to) { shown[pid] = to; delete tweens[pid]; return; }
  tweens[pid] = { from, to, t0: performance.now(), dur: Math.min(1400, 500 + Math.abs(to - from) * 0.6) };
  if (!tweenRaf) tweenRaf = requestAnimationFrame(stepTweens);
}
function stepTweens(now) {
  let more = false;
  Object.keys(tweens).forEach(pid => {
    const tw = tweens[pid], k = Math.min(1, (now - tw.t0) / tw.dur), e = 1 - Math.pow(1 - k, 3);
    const v = Math.round(tw.from + (tw.to - tw.from) * e);
    shown[pid] = v;
    const el = document.querySelector('.pod-score[data-pid="' + pid + '"]');
    if (el) { el.textContent = fmt(v); el.classList.toggle('neg', v < 0); }
    if (k < 1) more = true; else delete tweens[pid];
  });
  tweenRaf = more ? requestAnimationFrame(stepTweens) : null;
}
function renderPodiums() {
  const g = S.game, deltas = [];
  const top = Math.max.apply(null, S.players.map(p => p.score)), leaders = S.players.filter(p => p.score === top).length;
  $('#podiums').innerHTML = S.players.map(p => {
    const before = prevScores[p.id];
    const changed = before != null && before !== p.score;
    const cls = !changed ? '' : (p.score > before ? ' up' : ' down');
    if (changed) { tweenScore(p.id, shown[p.id] != null ? shown[p.id] : before, p.score); deltas.push([p.id, p.score - before]); }
    else if (!tweens[p.id]) shown[p.id] = p.score;
    prevScores[p.id] = p.score;
    const disp = tweens[p.id] ? shown[p.id] : p.score;
    const lead = top > 0 && p.score === top && leaders < S.players.length;
    return '<article class="podium' + (g.control === p.id ? ' control' : '') + '" style="--pc:' + safeColor(p.color) + '">' +
      '<span class="av-wrap">' + avatar(p) + (lead ? '<span class="crown" title="In the lead">' + CROWN + '</span>' : '') + '</span>' +
      '<div class="pod-name">' + esc(p.name) + (room && devicePids().has(p.id) ? '<span class="flag buzz" title="Buzzing in from their own device">Buzzer</span>' : '') + '</div>' +
      '<div class="pod-spot"><i class="dot" style="--pc:' + (SPOTS[p.spot] || SPOTS.money).color + '"></i>on ' + esc((SPOTS[p.spot] || SPOTS.money).name) + flags(p) + '</div>' +
      '<div class="pod-score' + (disp < 0 ? ' neg' : '') + cls + '" data-pid="' + p.id + '">' + fmt(disp) + '</div>' +
      '<div class="pod-cash"><span>P-Cash: <b>' + pc(p.pcash || 0) + '</b></span><button class="mini" data-act="openBribe" data-id="' + p.id + '"' + ((p.pcash || 0) > 0 ? '' : ' disabled') + '>Bribe</button></div>' +
      '<div class="pod-adj"><button class="mini" data-act="adj" data-id="' + p.id + '" data-n="-100" aria-label="Take 100 from ' + esc(p.name) + '">−100</button><button class="mini" data-act="adj" data-id="' + p.id + '" data-n="100" aria-label="Give 100 to ' + esc(p.name) + '">+100</button></div>' +
      (g.control === p.id ? '<span class="chip">Picks next</span>' : '') +
      '</article>';
  }).join('');
  // floating +/- points, shown once the rest of the screen has updated
  if (deltas.length) requestAnimationFrame(() => deltas.forEach(([id, n]) => {
    const o = $('#overlay');
    const t = o && !o.hidden ? o.querySelector('.judge[data-pid="' + id + '"]') : document.querySelector('.pod-score[data-pid="' + id + '"]');

  }));
}

// The question grows out of the square that was picked
function zoomIn(sh, r1) {
  if (reduced || !sh.animate || !r1 || !r1.width) return;
  const r2 = sh.getBoundingClientRect();
  if (!r2.width) return;
  const dx = (r1.left + r1.width / 2) - (r2.left + r2.width / 2), dy = (r1.top + r1.height / 2) - (r2.top + r2.height / 2);
  sh.classList.add('same');
  sh.animate([{ transform: 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + (r1.width / r2.width).toFixed(3) + ',' + (r1.height / r2.height).toFixed(3) + ')', opacity: 0.6 }, { transform: 'none', opacity: 1 }], { duration: 560, easing: 'cubic-bezier(.2,.9,.25,1.04)' });
}

function wheelSvg(sl, bad) {
  const n = sl.length, a = 360 / n, R = 150;
  const pt = (deg, r) => { const t = deg * Math.PI / 180; return (r * Math.sin(t)).toFixed(2) + ',' + (-r * Math.cos(t)).toFixed(2); };
  const fs = n <= 8 ? 16 : n <= 12 ? 13 : n <= 16 ? 11 : 9.5;
  const rim = bad ? 'var(--bad)' : 'var(--gold)';
  let h = '<circle r="155" style="fill:var(--stage);stroke:' + rim + ';stroke-width:9"/>';
  sl.forEach((s, i) => {
    const ci = (i % 6) + 1;
    let fill, txt = 'var(--ink)';
    if (s.type === 'china') fill = 'var(--w-china)';
    else if (s.type === 'bad') { fill = 'var(--b-slice)'; txt = 'var(--bad)'; }
    else if (bad) fill = 'var(--b' + ((i % 4) + 1) + ')';
    else { fill = 'var(--w' + ci + ')'; if (ci === 2) txt = 'var(--on-gold)'; }
    h += '<path d="M0,0 L' + pt(i * a - a / 2, R) + ' A' + R + ',' + R + ' 0 0 1 ' + pt(i * a + a / 2, R) + ' Z" style="fill:' + fill + ';stroke:var(--stage);stroke-width:2"/>';
    h += '<g transform="rotate(' + (i * a - 90).toFixed(2) + ')"><text class="wl" x="' + (R * 0.6).toFixed(1) + '" y="0" dy="0.35em" text-anchor="middle" style="fill:' + txt + ';font-size:' + fs + 'px">' + esc(s.label) + '</text></g>';
  });
  h += pegs(n, a);
  h += '<circle r="26" style="fill:var(--stage);stroke:' + rim + ';stroke-width:4"/><text class="wl" y="0" dy="0.35em" text-anchor="middle" style="fill:' + rim + ';font-size:' + (bad ? 12 : 15) + 'px">' + (bad ? 'BAD' : 'P3') + '</text>';
  return '<svg class="wheel" viewBox="-160 -160 320 320" role="img" aria-label="' + (bad ? 'The Bad Wheel' : 'The Good Wheel') + '">' + h + '</svg>';
}

/* ---------- live buzzers (room capability) ----------
   The host's page shares the roster, the open question and the buzz round in its room presence.
   Each player's phone sets {role:'player', pid, buzz:<round>} in its own presence.
   The host orders buzzes by when each one reached the host's own screen. */
const QS = new URLSearchParams(location.search);
const JOIN = { code: cleanCodeEarly(QS.get('code')), db: String(QS.get('db') || '') };
function cleanCodeEarly(c) { return String(c || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12); }

const newRound = () => { buzzState.round = Date.now(); };

function hostPresence() {
  const g = S.game, pd = g.pending, clueOpen = g.phase === 'clue' && pd && findClue(pd.cid);
  const f = clueOpen ? findClue(pd.cid) : null;
  return {
    role: 'host',
    title: String(S.board.title || 'P3 Trivia').slice(0, 60),
    players: S.players.map(p => ({ id: p.id, name: String(p.name).slice(0, 40), color: safeColor(p.color), score: p.score, pcash: p.pcash || 0 })),
    q: f ? { cat: catName(f.cat).slice(0, 60), v: f.value } : null,
    buzz: { round: buzzState.round, open: !!(f && buzzState.open) },
    locked: f ? S.players.filter(p => pd.wrong.includes(p.id) || p.frozen).map(p => p.id) : [],
    frozen: f ? S.players.filter(p => p.frozen).map(p => p.id) : [],
    bribeReplies: bribeReplies(),
    stage: screen
  };
}
/* --- secret bribes: a player's phone puts {bribe:{id, amt, note}} in its presence; only the host's screen lists it --- */
function bribeReplies() { const b = S.game.bribes || {}, o = {}; Object.keys(b).slice(-20).forEach(k => { o[k] = b[k]; }); return o; }
function markBribe(id, st) {
  const b = S.game.bribes = S.game.bribes || {};

function pendingBribes() {

  const done = S.game.bribes || {}, byPid = {};
  playerPeers().forEach(pe => {

    if (!b || typeof b !== 'object' || typeof b.id !== 'string' || typeof pid !== 'string' || !player(pid) || done[b.id]) return;
    const amt = Math.floor(Number(b.amt));
    if (!(amt > 0)) return;
    if (!byPid[pid] || pe.updatedAt > byPid[pid].t) byPid[pid] = { id: b.id.slice(0, 24), pid, amt, note: String(b.note || '').slice(0, 80), t: pe.updatedAt };
  });

function buzzList() {

const HOST_NAME = 'Whylo P!';
let screen = 'title', hostTimers = [];
function hasProgress() {
  return S.game.log.length > 0 || Object.keys(S.game.used || {}).length > 0 || S.players.some(p => p.score || p.pcash);
}
function setScreen(s) {
  screen = s;
  const app = document.querySelector('.app');
  if (app) app.hidden = s !== 'game';
  if (s !== 'host') { hostTimers.forEach(clearTimeout); hostTimers = []; }
  const t = $('#title'); if (t && s === 'title') t.dataset.drawn = '';
  renderTitle();
  if (s === 'game') { render(); boardIntro(); }
  lastHostPresence = ''; syncHost();
}
function titleHtml(still) {
  const prog = hasProgress(), canBuzz = !!room || (!IN_CLAUDE && !OFFLINE);
  let i = 0;
  const b = (cls, act, label, extra) => '<button class="ts-btn' + (cls ? ' ' + cls : '') + '" style="--i:' + (i++) + '" data-act="' + act + '"' + (extra || '') + '>' + label + '</button>';
  const menu = (prog
      ? b('primary', 'titleContinue', 'Continue Game') + b('', 'titleStart', 'New Game', ' data-confirm="Click again: new game"')
      : b('primary', 'titleStart', 'Start Game')) +
    b('', 'openSetup', 'Options') +
    b('', 'openRules', 'How to Play') +
    (canBuzz ? b('', 'openBuzzers', 'Phone Buzzers <small id="tsBuzzN">' + buzzerCount() + ' in</small>') : '') +
    b('', 'toggleSound', 'Sound: ' + (soundOn ? 'On' : 'Off')) +
    b('', 'toggleMusic', 'Music: ' + (musicOn ? 'On' : 'Off'));
  const sub = String(S.board.title || '').replace(/^\s*p3\s*trivia\s*/i, '').trim();
  return '<div class="ts-inner' + (still ? ' still' : '') + '">' +
    '<p class="ts-presents">Whylo TV Presents\u2026</p>' +
    '<div class="ts-sign marquee" data-gap="30" data-inset="10" data-bs="10"><span class="logo-p3" aria-hidden="true">P3</span><span class="ts-word">Trivia</span></div>' +
    (sub ? '<p class="ts-sub">' + esc(sub) + '</p>' : '') +
    '<nav class="ts-menu" aria-label="Main menu">' + menu + '</nav>' +
    '<div class="ts-players"><p class="ts-label">Tonight’s contestants</p><div class="ts-row">' + S.players.map(p => '<span class="ts-player">' + avatar(p) + esc(p.name) + '</span>').join('') + '</div></div>' +
    '</div>';
}
function hostHtml() {
  return '<div class="host-stage" role="dialog" aria-label="Your host">' +
    '<i class="hs-beam l" aria-hidden="true"></i><i class="hs-beam r" aria-hidden="true"></i>' +
    '<button class="btn ghost hs-skip" data-act="hostDone">Skip</button>' +
    '<p class="hs-your">Your host</p>' +
    '<div class="host-fig"><div class="hf-bob">' +
      '<div class="hf-head"><img src="' + HOST_HEAD + '" alt=""></div>' +
      '<svg class="hf-body" viewBox="0 0 220 250" aria-hidden="true"><defs><linearGradient id="hfNeon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="250"><stop offset="0" stop-color="#38a8ff"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff3df0"/></linearGradient></defs>' +
        '<path class="lim" d="M110 6 V140 M110 140 L76 232 L58 237 M110 140 L144 232 L162 237"/>' +
        '<path class="lim" d="M110 56 L70 100 L56 68"/>' +
        '<line x1="56" y1="68" x2="48" y2="45" stroke="#cfd3e6" stroke-width="7" stroke-linecap="round"/><circle cx="46" cy="37" r="10" fill="#8f96b0" stroke="#eef0fa" stroke-width="2.5"/>' +
        '<g class="hf-wave"><path class="lim" d="M110 56 L162 62 L190 24"/></g>' +
        '<path d="M110 24 L93 14 L93 34 Z M110 24 L127 14 L127 34 Z" fill="#ffc63a" stroke="#b87709" stroke-width="1.5" stroke-linejoin="round"/><circle cx="110" cy="24" r="4.5" fill="#ffe7a1" stroke="#b87709" stroke-width="1.2"/>' +
      '</svg></div></div>' +
    '<div class="hs-name marquee fast" data-gap="26" data-inset="9" data-bs="9"><span class="hs-text">' + esc(HOST_NAME) + '</span></div>' +
    '<button class="btn primary big hs-go" data-act="hostDone">Let’s play!</button>' +
    '</div>';
}
function hostSequence() {
  hostTimers.forEach(clearTimeout); hostTimers = [];
  const at = (ms, fn) => hostTimers.push(setTimeout(fn, reduced ? 0 : ms));
  SFX.drumroll(1.6); duckMusic(0.25);
  at(1650, () => { SFX.hit(); SFX.powerup(); flash('gold'); });
  at(7000, () => duckMusic(1));
  at(2450, () => { SFX.fanfare(); flash('gold'); cannons(110); });
  at(2750, () => SFX.applause(4.5));
  at(3700, () => cannons(70));
}
function renderTitle() {
  const el = $('#title');
  if (!el) return;
  if (mode === 'buzzer' || screen === 'game') { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  if (screen === 'host') {
    if (!el.querySelector('.host-stage')) { el.innerHTML = hostHtml(); bulbify(el); hostSequence(); }
    return;
  }
  const still = el.dataset.drawn === '1';
  el.innerHTML = titleHtml(still);
  el.dataset.drawn = '1';
  bulbify(el);
}
A.titleStart = () => { if (hasProgress()) resetGame(); setScreen('host'); };
A.titleContinue = () => { SFX.pick(); setScreen('game'); };
A.hostDone = () => { duckMusic(1); setScreen('game'); SFX.board(); };
A.toTitle = () => { S.ui.overlay = null; save(); renderOverlay(); setScreen('title'); SFX.pick(); };

/* ---------- boot ---------- */
let liveStarted = false;
function start(data) {
  S = data && data.S ? fromData(data.S) : load();
  S.players.forEach(p => { prevScores[p.id] = p.score; });
  if (mode === 'buzzer') enterBuzzerView();
  else { save(); render(); setScreen(data && (data.screen === 'game' || data.screen === 'host') ? 'game' : 'title'); }
  if (!liveStarted) { liveStarted = true; connectLive(); }
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ S: { board: S.board, players: S.players, settings: S.settings, game: S.game }, screen })); } catch (e) { /* optional */ } }
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
